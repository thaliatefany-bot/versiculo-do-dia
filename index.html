<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Versículo do Dia</title>
<style>
  :root {
    --sage: #6f9a7f;
    --sage-deep: #4e7a60;
    --sage-line: #cfe0d4;
    --sage-wash: #f7faf7;
    --sage-pill: #edf3ee;
    --ink: #3f3a38;
    --muted: #8d9490;
  }
  * { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }
  html, body { background: #fff; }
  body {
    min-height: 100vh; padding: 16px;
    display: flex; align-items: flex-start; justify-content: center;
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .card { width: 100%; max-width: 620px; background: var(--sage-wash); border: 1.5px solid var(--sage-line); border-radius: 28px; padding: 22px 24px 20px; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .hello { display: flex; align-items: center; gap: 10px; color: var(--sage); font-style: italic; font-size: 18px; min-width: 0; }
  .hello svg { width: 20px; height: 20px; flex: none; }
  svg.ln { stroke: var(--sage); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .icon { display: inline-flex; align-items: center; gap: 5px; background: transparent; border: 1.5px solid var(--sage-line); border-radius: 999px; padding: 5px 10px; color: var(--sage-deep); font-size: 13px; font-weight: 600; flex: none; }
  .icon:hover { background: var(--sage-pill); }
  .icon svg { width: 15px; height: 15px; }

  h1 { margin-top: 22px; font-size: clamp(34px, 8vw, 44px); line-height: 1.1; letter-spacing: -.01em; font-weight: 300; }
  .meta { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; font-size: 15px; }
  .meta b { font-weight: 600; }
  .meta span { color: var(--muted); }

  .verse { margin-top: 18px; background: var(--sage-pill); border-radius: 18px; padding: 16px 18px; font-size: 16px; line-height: 1.55; }
  .verse .ref { display: block; margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--sage-deep); letter-spacing: .03em; }
  .verse-actions { margin-top: 12px; }
  .chip { background: #fff; border: 1.5px solid var(--sage-line); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600; color: var(--sage-deep); }
  .chip:hover { border-color: var(--sage); }
  .chip.on { background: var(--sage); border-color: var(--sage); color: #fff; }
  .foot { margin-top: 14px; font-size: 14px; line-height: 1.45; font-style: italic; color: var(--muted); }

  .panel-title { color: var(--sage); font-style: italic; font-size: 18px; display: flex; align-items: center; gap: 10px; }
  .panel-title svg { width: 20px; height: 20px; }
  .saved-list { margin-top: 14px; display: grid; gap: 10px; }
  .item { background: var(--sage-pill); border-radius: 16px; padding: 14px 16px; font-size: 15px; line-height: 1.55; }
  .item .ref { display: block; margin-top: 6px; font-size: 12.5px; font-weight: 600; color: var(--sage-deep); }
  .item .row { margin-top: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .item .rm { background: none; border: none; color: var(--muted); font-size: 12px; text-decoration: underline; padding: 2px; }
  .item .rm:hover { color: var(--sage-deep); }
  .empty { margin-top: 16px; font-size: 14px; color: var(--muted); font-style: italic; }
  .warn { margin-top: 12px; font-size: 12px; color: #a0702a; }
</style>
</head>
<body>
<main class="card">

  <section id="view-main">
    <div class="top">
      <div class="hello">
        <svg class="ln" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4l1.6 4.4L16 10l-4.4 1.6L10 16l-1.6-4.4L4 10l4.4-1.6L10 4z"/><path d="M18 14l.8 2.2L21 17l-2.2.8L18 20l-.8-2.2L15 17l2.2-.8L18 14z"/></svg>
        <span id="hello"></span>
      </div>
      <button class="icon" id="btn-saved" aria-label="Ver versículos salvos">
        <svg class="ln" viewBox="0 0 24 24"><path d="M12 21s-7-4.6-9.3-9A5.3 5.3 0 0 1 12 6.6 5.3 5.3 0 0 1 21.3 12C19 16.4 12 21 12 21z"/></svg>
        Salvos <span id="saved-count">0</span>
      </button>
    </div>
    <h1 id="saudacao"></h1>
    <div class="meta"><b id="hora"></b><span id="data"></span></div>
    <div class="verse">
      <span id="text"></span><span class="ref" id="ref"></span>
      <div class="verse-actions"><button class="chip" id="btn-save">♡ Salvar versículo</button></div>
    </div>
    <div class="foot" id="frase"></div>
  </section>

  <section id="view-saved" hidden>
    <div class="top">
      <div class="panel-title">
        <svg class="ln" viewBox="0 0 24 24"><path d="M12 21s-7-4.6-9.3-9A5.3 5.3 0 0 1 12 6.6 5.3 5.3 0 0 1 21.3 12C19 16.4 12 21 12 21z"/></svg>
        Versículos salvos
      </div>
      <button class="icon" id="btn-back">← Voltar</button>
    </div>
    <div class="saved-list" id="saved-list"></div>
    <div class="empty" id="saved-empty" hidden>Você ainda não salvou nenhum versículo. Toque em “♡ Salvar versículo” para guardar o de hoje.</div>
    <div class="warn" id="warn-saved" hidden>Este navegador não está guardando dados: seus salvos podem se perder ao fechar a página.</div>
  </section>

</main>

<script>
  const NOME = 'Estéfany';   // para mudar o nome na saudação, edite aqui

  // ---------- Frases motivacionais ----------
  const FRASES = [
    { text: "Bora fazer acontecer! Hoje o dia vai ser incrível." },
    { text: "O único modo de fazer um excelente trabalho é amar o que você faz.", author: "Steve Jobs" },
    { text: "Um passo de cada vez já é caminhar." },
    { text: "Não é porque as coisas são difíceis que não ousamos; é porque não ousamos que elas são difíceis.", author: "Sêneca" },
    { text: "Hoje é um ótimo dia para começar algo novo." },
    { text: "A jornada de mil milhas começa com um único passo.", author: "Lao Tsé" },
    { text: "Você é capaz de mais do que imagina." },
    { text: "Comece de onde você está. Use o que você tem. Faça o que você pode.", author: "Arthur Ashe" },
    { text: "Respire fundo, confie no processo e siga em frente." },
    { text: "Feito é melhor do que perfeito.", author: "Sheryl Sandberg" },
    { text: "Seu esforço de hoje é a conquista de amanhã." },
    { text: "A vida é 10% o que acontece com você e 90% como você reage.", author: "Charles Swindoll" },
    { text: "Capriche no hoje, o amanhã agradece." },
    { text: "Tudo parece impossível até que seja feito.", author: "Nelson Mandela" },
    { text: "Dias bons começam com decisões corajosas." },
    { text: "Somos o que repetidamente fazemos. A excelência, portanto, não é um feito, e sim um hábito.", author: "Will Durant" },
    { text: "Vai com coragem: você não está sozinha nessa caminhada." },
    { text: "Pequenos progressos diários somam grandes resultados." },
    { text: "Que hoje seja leve, produtivo e cheio de boas surpresas." },
    { text: "Acorde, sorria e vá atrás do que faz seu coração bater mais forte." },
    { text: "Não precisa ser perfeito, precisa ser começado." },
    { text: "Hoje você escolhe o tom do seu dia. Escolha o bom!" },
    { text: "Sonhe grande, comece pequeno, mas comece hoje." },
    { text: "Cada manhã é uma nova chance de fazer diferente e melhor." },
    { text: "Foco, fé e paciência: o seu tempo está chegando." },
    { text: "Gratidão transforma o comum em extraordinário." },
    { text: "Se der medo, vai com medo mesmo!" },
    { text: "Você já superou dias difíceis antes. Hoje não vai ser diferente." },
    { text: "O melhor momento para agir é agora." },
    { text: "Faça hoje o seu melhor, e deixe o resto nas mãos de Deus." },
    { text: "Brilhe sem pressa: cada flor tem seu tempo." }
  ];

  // ---------- Bíblia (Almeida Corrigida Fiel): versículos de conforto, fé e esperança escolhidos a dedo ----------
  // Cada item: [índice do livro, capítulo, versículo, texto]
  const LIVROS = ["Salmos", "Provérbios", "Isaías", "Mateus", "Marcos", "Lucas", "João", "Romanos", "1 Coríntios", "2 Coríntios", "Gálatas", "Efésios", "Filipenses", "Colossenses", "1 Tessalonicenses", "2 Timóteo", "Hebreus", "Tiago", "1 Pedro", "1 João"];
  const BIBLIA = [[0,1,1,"Bem-aventurado o homem que não anda segundo o conselho dos ímpios, nem se detém no caminho dos pecadores, nem se assenta na roda dos escarnecedores."],[0,1,2,"Antes tem o seu prazer na lei do Senhor, e na sua lei medita de dia e de noite."],[0,1,3,"Pois será como a árvore plantada junto a ribeiros de águas, a qual dá o seu fruto no seu tempo; as suas folhas não cairão, e tudo quanto fizer prosperará."],[0,1,4,"Não são assim os ímpios; mas são como a moinha que o vento espalha."],[0,1,5,"Por isso os ímpios não subsistirão no juízo, nem os pecadores na congregação dos justos."],[0,1,6,"Porque o Senhor conhece o caminho dos justos; porém o caminho dos ímpios perecerá."],[0,3,1,"Senhor, como se têm multiplicado os meus adversários! São muitos os que se levantam contra mim."],[0,3,2,"Muitos dizem da minha alma: Não há salvação para ele em Deus. (Selá.)"],[0,3,3,"Porém tu, Senhor, és um escudo para mim, a minha glória, e o que exalta a minha cabeça."],[0,3,4,"Com a minha voz clamei ao Senhor, e ouviu-me desde o seu santo monte. (Selá.)"],[0,3,5,"Eu me deitei e dormi; acordei, porque o Senhor me sustentou."],[0,3,6,"Não temerei dez milhares de pessoas que se puseram contra mim e me cercam."],[0,3,7,"Levanta-te, Senhor; salva-me, Deus meu; pois feriste a todos os meus inimigos nos queixos; quebraste os dentes aos ímpios."],[0,3,8,"A salvação vem do Senhor; sobre o teu povo seja a tua bênção. (Selá.)"],[0,4,1,"Ouve-me quando eu clamo, ó Deus da minha justiça, na angústia me deste largueza; tem misericórdia de mim e ouve a minha oração."],[0,4,2,"Filhos dos homens, até quando convertereis a minha glória em infâmia? Até quando amareis a vaidade e buscareis a mentira? (Selá.)"],[0,4,3,"Sabei, pois, que o Senhor separou para si aquele que é piedoso; o Senhor ouvirá quando eu clamar a ele."],[0,4,4,"Perturbai-vos e não pequeis; falai com o vosso coração sobre a vossa cama, e calai-vos. (Selá.)"],[0,4,5,"Oferecei sacrifícios de justiça, e confiai no Senhor."],[0,4,6,"Muitos dizem: Quem nos mostrará o bem? Senhor, exalta sobre nós a luz do teu rosto."],[0,4,7,"Puseste alegria no meu coração, mais do que no tempo em que se lhes multiplicaram o trigo e o vinho."],[0,4,8,"Em paz também me deitarei e dormirei, porque só tu, Senhor, me fazes habitar em segurança."],[0,8,1,"Ó Senhor, Senhor nosso, quão admirável é o teu nome em toda a terra, pois puseste a tua glória sobre os céus!"],[0,8,2,"Tu ordenaste força da boca das crianças e dos que mamam, por causa dos teus inimigos, para fazer calar ao inimigo e ao vingador."],[0,8,3,"Quando vejo os teus céus, obra dos teus dedos, a lua e as estrelas que preparaste;"],[0,8,4,"Que é o homem mortal para que te lembres dele? e o filho do homem, para que o visites?"],[0,8,5,"Pois pouco menor o fizeste do que os anjos, e de glória e de honra o coroaste."],[0,8,6,"Fazes com que ele tenha domínio sobre as obras das tuas mãos; tudo puseste debaixo de seus pés:"],[0,8,7,"Todas as ovelhas e bois, assim como os animais do campo,"],[0,8,8,"As aves dos céus, e os peixes do mar, e tudo o que passa pelas veredas dos mares."],[0,8,9,"Ó Senhor, Senhor nosso, quão admirável é o teu nome sobre toda a terra!"],[0,16,5,"O Senhor é a porção da minha herança e do meu cálice; tu sustentas a minha sorte."],[0,16,6,"As linhas caem-me em lugares deliciosos: sim, coube-me uma formosa herança."],[0,16,7,"Louvarei ao Senhor que me aconselhou; até os meus rins me ensinam de noite."],[0,16,8,"Tenho posto o Senhor continuamente diante de mim; por isso que ele está à minha mão direita, nunca vacilarei."],[0,16,9,"Portanto está alegre o meu coração e se regozija a minha glória; também a minha carne repousará segura."],[0,16,10,"Pois não deixarás a minha alma no inferno, nem permitirás que o teu Santo veja corrupção."],[0,16,11,"Far-me-ás ver a vereda da vida; na tua presença há fartura de alegrias; à tua mão direita há delícias perpetuamente."],[0,18,1,"Eu te amarei, ó SENHOR, fortaleza minha."],[0,18,2,"O Senhor é o meu rochedo, e o meu lugar forte, e o meu libertador; o meu Deus, a minha fortaleza, em quem confio; o meu escudo, a força da minha salvação, e o meu alto refúgio."],[0,18,3,"Invocarei o nome do Senhor, que é digno de louvor, e ficarei livre dos meus inimigos."],[0,18,28,"Porque tu acenderás a minha candeia; o Senhor meu Deus iluminará as minhas trevas."],[0,18,29,"Porque contigo entrei pelo meio duma tropa, com o meu Deus saltei uma muralha."],[0,18,30,"O caminho de Deus é perfeito; a palavra do Senhor é provada; é um escudo para todos os que nele confiam."],[0,18,31,"Porque quem é Deus senão o Senhor? E quem é rochedo senão o nosso Deus?"],[0,18,32,"Deus é o que me cinge de força e aperfeiçoa o meu caminho."],[0,18,33,"Faz os meus pés como os das cervas, e põe-me nas minhas alturas."],[0,18,34,"Ensina as minhas mãos para a guerra, de sorte que os meus braços quebraram um arco de cobre."],[0,18,35,"Também me deste o escudo da tua salvação; a tua mão direita me susteve, e a tua mansidão me engrandeceu."],[0,18,36,"Alargaste os meus passos debaixo de mim, de maneira que os meus artelhos não vacilaram."],[0,19,1,"Os céus declaram a glória de Deus e o firmamento anuncia a obra das suas mãos."],[0,19,2,"Um dia faz declaração a outro dia, e uma noite mostra sabedoria a outra noite."],[0,19,3,"Não há linguagem nem fala onde não se ouça a sua voz."],[0,19,4,"A sua linha se estende por toda a terra, e as suas palavras até ao fim do mundo. Neles pôs uma tenda para o sol,"],[0,19,5,"O qual é como um noivo que sai do seu tálamo, e se alegra como um herói, a correr o seu caminho."],[0,19,6,"A sua saída é desde uma extremidade dos céus, e o seu curso até à outra extremidade, e nada se esconde ao seu calor."],[0,19,7,"A lei do Senhor é perfeita, e refrigera a alma; o testemunho do Senhor é fiel, e dá sabedoria aos símplices."],[0,19,8,"Os preceitos do Senhor são retos e alegram o coração; o mandamento do Senhor é puro, e ilumina os olhos."],[0,19,9,"O temor do Senhor é limpo, e permanece eternamente; os juízos do Senhor são verdadeiros e justos juntamente."],[0,19,10,"Mais desejáveis são do que o ouro, sim, do que muito ouro fino; e mais doces do que o mel e o licor dos favos."],[0,19,11,"Também por eles é admoestado o teu servo; e em os guardar há grande recompensa."],[0,19,12,"Quem pode entender os seus erros? Expurga-me tu dos que me são ocultos."],[0,19,13,"Também da soberba guarda o teu servo, para que se não assenhoreie de mim. Então serei sincero, e ficarei limpo de grande transgressão."],[0,19,14,"Sejam agradáveis as palavras da minha boca e a meditação do meu coração perante a tua face, Senhor, Rocha minha e Redentor meu!"],[0,20,1,"O SENHOR te ouça no dia da angústia, o nome do Deus de Jacó te proteja."],[0,20,2,"Envie-te socorro desde o seu santuário, e te sustenha desde Sião."],[0,20,3,"Lembre-se de todas as tuas ofertas, e aceite os teus holocaustos. (Selá.)"],[0,20,4,"Conceda-te conforme ao teu coração, e cumpra todo o teu plano."],[0,20,5,"Nós nos alegraremos pela tua salvação, e em nome do nosso Deus arvoraremos pendões; cumpra o Senhor todas as tuas petições."],[0,20,6,"Agora sei que o Senhor salva o seu ungido; ele o ouvirá desde o seu santo céu, com a força salvadora da sua mão direita."],[0,20,7,"Uns confiam em carros e outros em cavalos, mas nós faremos menção do nome do Senhor nosso Deus."],[0,20,8,"Uns encurvam-se e caem, mas nós nos levantamos e estamos de pé."],[0,20,9,"Salva-nos, Senhor; ouça-nos o rei quando clamarmos."],[0,23,1,"O SENHOR é o meu pastor, nada me faltará."],[0,23,2,"Deitar-me faz em verdes pastos, guia-me mansamente a águas tranqüilas."],[0,23,3,"Refrigera a minha alma; guia-me pelas veredas da justiça, por amor do seu nome."],[0,23,4,"Ainda que eu andasse pelo vale da sombra da morte, não temeria mal algum, porque tu estás comigo; a tua vara e o teu cajado me consolam."],[0,23,5,"Preparas uma mesa perante mim na presença dos meus inimigos, unges a minha cabeça com óleo, o meu cálice transborda."],[0,23,6,"Certamente que a bondade e a misericórdia me seguirão todos os dias da minha vida; e habitarei na casa do Senhor por longos dias."],[0,24,1,"Do SENHOR é a terra e a sua plenitude, o mundo e aqueles que nele habitam."],[0,24,2,"Porque ele a fundou sobre os mares, e a firmou sobre os rios."],[0,24,3,"Quem subirá ao monte do Senhor, ou quem estará no seu lugar santo?"],[0,24,4,"Aquele que é limpo de mãos e puro de coração, que não entrega a sua alma à vaidade, nem jura enganosamente."],[0,24,5,"Este receberá a bênção do Senhor e a justiça do Deus da sua salvação."],[0,24,6,"Esta é a geração daqueles que buscam, daqueles que buscam a tua face, ó Deus de Jacó. (Selá.)"],[0,24,7,"Levantai, ó portas, as vossas cabeças; levantai-vos, ó entradas eternas, e entrará o Rei da Glória."],[0,24,8,"Quem é este Rei da Glória? O Senhor forte e poderoso, o Senhor poderoso na guerra."],[0,24,9,"Levantai, ó portas, as vossas cabeças, levantai-vos, ó entradas eternas, e entrará o Rei da Glória."],[0,24,10,"Quem é este Rei da Glória? O Senhor dos Exércitos, ele é o Rei da Glória. (Selá.)"],[0,25,1,"A ti, SENHOR, levanto a minha alma."],[0,25,2,"Deus meu, em ti confio, não me deixes confundido, nem que os meus inimigos triunfem sobre mim."],[0,25,3,"Na verdade, não serão confundidos os que esperam em ti; confundidos serão os que transgridem sem causa."],[0,25,4,"Faze-me saber os teus caminhos, Senhor; ensina-me as tuas veredas."],[0,25,5,"Guia-me na tua verdade, e ensina-me, pois tu és o Deus da minha salvação; por ti estou esperando todo o dia."],[0,25,6,"Lembra-te, Senhor, das tuas misericórdias e das tuas benignidades, porque são desde a eternidade."],[0,25,7,"Não te lembres dos pecados da minha mocidade, nem das minhas transgressões; mas segundo a tua misericórdia, lembra-te de mim, por tua bondade, Senhor."],[0,25,8,"Bom e reto é o Senhor; por isso ensinará o caminho aos pecadores."],[0,25,9,"Guiará os mansos em justiça e aos mansos ensinará o seu caminho."],[0,25,10,"Todas as veredas do Senhor são misericórdia e verdade para aqueles que guardam a sua aliança e os seus testemunhos."],[0,27,1,"O SENHOR é a minha luz e a minha salvação; a quem temerei? O SENHOR é a força da minha vida; de quem me recearei?"],[0,27,2,"Quando os malvados, meus adversários e meus inimigos, se chegaram contra mim, para comerem as minhas carnes, tropeçaram e caíram."],[0,27,3,"Ainda que um exército me cercasse, o meu coração não temeria; ainda que a guerra se levantasse contra mim, nisto confiaria."],[0,27,4,"Uma coisa pedi ao Senhor, e a buscarei: que possa morar na casa do Senhor todos os dias da minha vida, para contemplar a formosura do Senhor, e inquirir no seu templo."],[0,27,5,"Porque no dia da adversidade me esconderá no seu pavilhão; no oculto do seu tabernáculo me esconderá; pôr-me-á sobre uma rocha."],[0,27,6,"Também agora a minha cabeça será exaltada sobre os meus inimigos que estão em redor de mim; por isso oferecerei sacrifício de júbilo no seu tabernáculo; cantarei, sim, cantarei louvores ao Senhor."],[0,27,7,"Ouve, Senhor, a minha voz quando clamo; tem também piedade de mim, e responde-me."],[0,27,8,"Quando tu disseste: Buscai o meu rosto; o meu coração disse a ti: O teu rosto, Senhor, buscarei."],[0,27,10,"Porque, quando meu pai e minha mãe me desampararem, o Senhor me recolherá."],[0,27,11,"Ensina-me, Senhor, o teu caminho, e guia-me pela vereda direita, por causa dos meus inimigos."],[0,27,12,"Não me entregues à vontade dos meus adversários; pois se levantaram falsas testemunhas contra mim, e os que respiram crueldade."],[0,27,13,"Pereceria sem dúvida, se não cresse que veria a bondade do Senhor na terra dos viventes."],[0,27,14,"Espera no Senhor, anima-te, e ele fortalecerá o teu coração; espera, pois, no Senhor."],[0,28,6,"Bendito seja o Senhor, porque ouviu a voz das minhas súplicas."],[0,28,7,"O Senhor é a minha força e o meu escudo; nele confiou o meu coração, e fui socorrido; assim o meu coração salta de prazer, e com o meu canto o louvarei."],[0,28,8,"O Senhor é a força do seu povo; também é a força salvadora do seu ungido."],[0,28,9,"Salva o teu povo, e abençoa a tua herança; e apascenta-os e exalta-os para sempre."],[0,29,11,"O Senhor dará força ao seu povo; o Senhor abençoará o seu povo com paz."],[0,30,1,"Exaltar-te-ei, ó SENHOR, porque tu me exaltaste; e não fizeste com que meus inimigos se alegrassem sobre mim."],[0,30,2,"Senhor meu Deus, clamei a ti, e tu me saraste."],[0,30,3,"Senhor, fizeste subir a minha alma da sepultura; conservaste-me a vida para que não descesse ao abismo."],[0,30,4,"Cantai ao Senhor, vós que sois seus santos, e celebrai a memória da sua santidade."],[0,30,6,"Eu dizia na minha prosperidade: Não vacilarei jamais."],[0,30,7,"Tu, Senhor, pelo teu favor fizeste forte a minha montanha; tu encobriste o teu rosto, e fiquei perturbado."],[0,30,8,"A ti, Senhor, clamei, e ao Senhor supliquei."],[0,30,10,"Ouve, Senhor, e tem piedade de mim, Senhor; sê o meu auxílio."],[0,30,11,"Tornaste o meu pranto em folguedo; desataste o meu pano de saco, e me cingiste de alegria,"],[0,30,12,"Para que a minha glória a ti cante louvores, e não se cale. Senhor, meu Deus, eu te louvarei para sempre."],[0,31,1,"Em ti, SENHOR, confio; nunca me deixes confundido. Livra-me pela tua justiça."],[0,31,2,"Inclina para mim os teus ouvidos, livra-me depressa; sê a minha firme rocha, uma casa fortíssima que me salve."],[0,31,3,"Porque tu és a minha rocha e a minha fortaleza; assim, por amor do teu nome, guia-me e encaminha-me."],[0,31,4,"Tira-me da rede que para mim esconderam, pois tu és a minha força."],[0,31,5,"Nas tuas mãos encomendo o meu espírito; tu me redimiste, Senhor Deus da verdade."],[0,31,6,"Odeio aqueles que se entregam a vaidades enganosas; eu, porém, confio no Senhor."],[0,31,7,"Eu me alegrarei e regozijarei na tua benignidade, pois consideraste a minha aflição; conheceste a minha alma nas angústias."],[0,31,8,"E não me entregaste nas mãos do inimigo; puseste os meus pés num lugar espaçoso."],[0,31,19,"Oh! quão grande é a tua bondade, que guardaste para os que te temem, a qual operaste para aqueles que em ti confiam na presença dos filhos dos homens!"],[0,31,20,"Tu os esconderás, no secreto da tua presença, dos desaforos dos homens; encobri-los-ás em um pavilhão, da contenda das línguas."],[0,31,21,"Bendito seja o Senhor, pois fez maravilhosa a sua misericórdia para comigo em cidade segura."],[0,31,22,"Pois eu dizia na minha pressa: Estou cortado de diante dos teus olhos; não obstante, tu ouviste a voz das minhas súplicas, quando eu a ti clamei."],[0,31,23,"Amai ao Senhor, vós todos que sois seus santos; porque o Senhor guarda os fiéis e retribui com abundância ao que usa de soberba."],[0,31,24,"Esforçai-vos, e ele fortalecerá o vosso coração, vós todos que esperais no Senhor."],[0,32,7,"Tu és o lugar em que me escondo; tu me preservas da angústia; tu me cinges de alegres cantos de livramento. (Selá.)"],[0,32,8,"Instruir-te-ei, e ensinar-te-ei o caminho que deves seguir; guiar-te-ei com os meus olhos."],[0,32,9,"Não sejais como o cavalo, nem como a mula, que não têm entendimento, cuja boca precisa de cabresto e freio para que não se cheguem a ti."],[0,32,10,"O ímpio tem muitas dores, mas àquele que confia no Senhor a misericórdia o cercará."],[0,32,11,"Alegrai-vos no Senhor, e regozijai-vos, vós os justos; e cantai alegremente, todos vós que sois retos de coração."],[0,33,1,"Regozijai-vos no SENHOR, vós justos, pois aos retos convém o louvor."],[0,33,2,"Louvai ao Senhor com harpa, cantai a ele com o saltério e um instrumento de dez cordas."],[0,33,3,"Cantai-lhe um cântico novo; tocai bem e com júbilo."],[0,33,4,"Porque a palavra do Senhor é reta, e todas as suas obras são fiéis."],[0,33,5,"Ele ama a justiça e o juízo; a terra está cheia da bondade do Senhor."],[0,33,6,"Pela palavra do Senhor foram feitos os céus, e todo o exército deles pelo espírito da sua boca."],[0,33,7,"Ele ajunta as águas do mar como num montão; põe os abismos em depósitos."],[0,33,8,"Tema toda a terra ao Senhor; temam-no todos os moradores do mundo."],[0,33,9,"Porque falou, e foi feito; mandou, e logo apareceu."],[0,33,10,"O Senhor desfaz o conselho dos gentios, quebranta os intentos dos povos."],[0,33,11,"O conselho do Senhor permanece para sempre; os intentos do seu coração de geração em geração."],[0,33,12,"Bem-aventurada é a nação cujo Deus é o Senhor, e o povo ao qual escolheu para sua herança."],[0,33,13,"O Senhor olha desde os céus e está vendo a todos os filhos dos homens."],[0,33,14,"Do lugar da sua habitação contempla todos os moradores da terra."],[0,33,15,"Ele é que forma o coração de todos eles, que contempla todas as suas obras."],[0,33,16,"Não há rei que se salve com a grandeza dum exército, nem o homem valente se livra pela muita força."],[0,33,17,"O cavalo é falaz para a segurança; não livra ninguém com a sua grande força."],[0,33,18,"Eis que os olhos do Senhor estão sobre os que o temem, sobre os que esperam na sua misericórdia;"],[0,33,19,"Para lhes livrar as almas da morte, e para os conservar vivos na fome."],[0,33,20,"A nossa alma espera no Senhor; ele é o nosso auxílio e o nosso escudo."],[0,33,21,"Pois nele se alegra o nosso coração; porquanto temos confiado no seu santo nome."],[0,33,22,"Seja a tua misericórdia, Senhor, sobre nós, como em ti esperamos."],[0,34,1,"Louvarei ao SENHOR em todo o tempo; o seu louvor estará continuamente na minha boca."],[0,34,2,"A minha alma se gloriará no Senhor; os mansos o ouvirão e se alegrarão."],[0,34,3,"Engrandecei ao Senhor comigo; e juntos exaltemos o seu nome."],[0,34,4,"Busquei ao Senhor, e ele me respondeu; livrou-me de todos os meus temores."],[0,34,5,"Olharam para ele, e foram iluminados; e os seus rostos não ficaram confundidos."],[0,34,6,"Clamou este pobre, e o Senhor o ouviu, e o salvou de todas as suas angústias."],[0,34,7,"O anjo do Senhor acampa-se ao redor dos que o temem, e os livra."],[0,34,8,"Provai, e vede que o Senhor é bom; bem-aventurado o homem que nele confia."],[0,34,9,"Temei ao Senhor, vós, os seus santos, pois nada falta aos que o temem."],[0,34,10,"Os filhos dos leões necessitam e sofrem fome, mas àqueles que buscam ao Senhor bem nenhum faltará."],[0,34,11,"Vinde, meninos, ouvi-me; eu vos ensinarei o temor do Senhor."],[0,34,12,"Quem é o homem que deseja a vida, que quer largos dias para ver o bem?"],[0,34,13,"Guarda a tua língua do mal, e os teus lábios de falarem o engano."],[0,34,14,"Aparta-te do mal, e faze o bem; procura a paz, e segue-a."],[0,34,15,"Os olhos do Senhor estão sobre os justos, e os seus ouvidos atentos ao seu clamor."],[0,34,16,"A face do Senhor está contra os que fazem o mal, para desarraigar da terra a memória deles."],[0,34,17,"Os justos clamam, e o Senhor os ouve, e os livra de todas as suas angústias."],[0,34,18,"Perto está o Senhor dos que têm o coração quebrantado, e salva os contritos de espírito."],[0,34,19,"Muitas são as aflições do justo, mas o Senhor o livra de todas."],[0,34,20,"Ele lhe guarda todos os seus ossos; nem sequer um deles se quebra."],[0,34,22,"O Senhor resgata a alma dos seus servos, e nenhum dos que nele confiam será punido."],[0,36,5,"A tua misericórdia, Senhor, está nos céus, e a tua fidelidade chega até às mais excelsas nuvens."],[0,36,6,"A tua justiça é como as grandes montanhas; os teus juízos são um grande abismo. Senhor, tu conservas os homens e os animais."],[0,36,7,"Quão preciosa é, ó Deus, a tua benignidade, pelo que os filhos dos homens se abrigam à sombra das tuas asas."],[0,36,8,"Eles se fartarão da gordura da tua casa, e os farás beber da corrente das tuas delícias;"],[0,36,9,"Porque em ti está o manancial da vida; na tua luz veremos a luz."],[0,37,3,"Confia no Senhor e faze o bem; habitarás na terra, e verdadeiramente serás alimentado."],[0,37,4,"Deleita-te também no Senhor, e te concederá os desejos do teu coração."],[0,37,5,"Entrega o teu caminho ao Senhor; confia nele, e ele o fará."],[0,37,6,"E ele fará sobressair a tua justiça como a luz, e o teu juízo como o meio-dia."],[0,37,7,"Descansa no Senhor, e espera nele; não te indignes por causa daquele que prospera em seu caminho, por causa do homem que executa astutos intentos."],[0,37,9,"Porque os malfeitores serão desarraigados; mas aqueles que esperam no Senhor herdarão a terra."],[0,37,10,"Pois ainda um pouco, e o ímpio não existirá; olharás para o seu lugar, e não aparecerá."],[0,37,11,"Mas os mansos herdarão a terra, e se deleitarão na abundância de paz."],[0,37,23,"Os passos de um homem bom são confirmados pelo Senhor, e deleita-se no seu caminho."],[0,37,24,"Ainda que caia, não ficará prostrado, pois o Senhor o sustém com a sua mão."],[0,37,25,"Fui moço, e agora sou velho; mas nunca vi desamparado o justo, nem a sua semente a mendigar o pão."],[0,37,26,"Compadece-se sempre, e empresta, e a sua semente é abençoada."],[0,40,1,"Esperei com paciência no SENHOR, e ele se inclinou para mim, e ouviu o meu clamor."],[0,40,2,"Tirou-me dum lago horrível, dum charco de lodo, pôs os meus pés sobre uma rocha, firmou os meus passos."],[0,40,3,"E pôs um novo cântico na minha boca, um hino ao nosso Deus; muitos o verão, e temerão, e confiarão no Senhor."],[0,40,4,"Bem-aventurado o homem que põe no Senhor a sua confiança, e que não respeita os soberbos nem os que se desviam para a mentira."],[0,40,5,"Muitas são, Senhor meu Deus, as maravilhas que tens operado para conosco, e os teus pensamentos não se podem contar diante de ti; se eu os quisera anunciar, e deles falar, são mais do que se podem contar."],[0,42,1,"Assim como o cervo brama pelas correntes das águas, assim suspira a minha alma por ti, ó Deus!"],[0,42,2,"A minha alma tem sede de Deus, do Deus vivo; quando entrarei e me apresentarei ante a face de Deus?"],[0,42,3,"As minhas lágrimas servem-me de mantimento de dia e de noite, enquanto me dizem constantemente: Onde está o teu Deus?"],[0,42,4,"Quando me lembro disto, dentro de mim derramo a minha alma; pois eu havia ido com a multidão. Fui com eles à casa de Deus, com voz de alegria e louvor, com a multidão que festejava."],[0,42,5,"Por que estás abatida, ó minha alma, e por que te perturbas em mim? Espera em Deus, pois ainda o louvarei pela salvação da sua face."],[0,42,6,"Ó meu Deus, dentro de mim a minha alma está abatida; por isso lembro-me de ti desde a terra do Jordão, e desde os hermonitas, desde o pequeno monte."],[0,42,7,"Um abismo chama outro abismo, ao ruído das tuas catadupas; todas as tuas ondas e as tuas vagas têm passado sobre mim."],[0,42,8,"Contudo o Senhor mandará a sua misericórdia de dia, e de noite a sua canção estará comigo, uma oração ao Deus da minha vida."],[0,42,9,"Direi a Deus, minha rocha: Por que te esqueceste de mim? Por que ando lamentando por causa da opressão do inimigo?"],[0,42,10,"Com ferida mortal em meus ossos me afrontam os meus adversários, quando todo dia me dizem: Onde está o teu Deus?"],[0,42,11,"Por que estás abatida, ó minha alma, e por que te perturbas dentro de mim? Espera em Deus, pois ainda o louvarei, o qual é a salvação da minha face, e o meu Deus."],[0,43,1,"Faze-me justiça, ó Deus, e pleiteia a minha causa contra a nação ímpia. Livra-me do homem fraudulento e injusto."],[0,43,2,"Pois tu és o Deus da minha fortaleza; por que me rejeitas? Por que ando lamentando por causa da opressão do inimigo?"],[0,43,3,"Envia a tua luz e a tua verdade, para que me guiem e me levem ao teu santo monte, e aos teus tabernáculos."],[0,43,4,"Então irei ao altar de Deus, a Deus, que é a minha grande alegria, e com harpa te louvarei, ó Deus, Deus meu."],[0,43,5,"Por que estás abatida, ó minha alma? E por que te perturbas dentro de mim? Espera em Deus, pois ainda o louvarei, o qual é a salvação da minha face e Deus meu."],[0,46,1,"Deus é o nosso refúgio e fortaleza, socorro bem presente na angústia."],[0,46,2,"Portanto não temeremos, ainda que a terra se mude, e ainda que os montes se transportem para o meio dos mares."],[0,46,3,"Ainda que as águas rujam e se perturbem, ainda que os montes se abalem pela sua braveza. (Selá.)"],[0,46,4,"Há um rio cujas correntes alegram a cidade de Deus, o santuário das moradas do Altíssimo."],[0,46,5,"Deus está no meio dela; não se abalará. Deus a ajudará, já ao romper da manhã."],[0,46,6,"Os gentios se embraveceram; os reinos se moveram; ele levantou a sua voz e a terra se derreteu."],[0,46,7,"O Senhor dos Exércitos está conosco; o Deus de Jacó é o nosso refúgio. (Selá.)"],[0,46,8,"Vinde, contemplai as obras do Senhor; que desolações tem feito na terra!"],[0,46,9,"Ele faz cessar as guerras até ao fim da terra; quebra o arco e corta a lança; queima os carros no fogo."],[0,46,10,"Aquietai-vos, e sabei que eu sou Deus; serei exaltado entre os gentios; serei exaltado sobre a terra."],[0,46,11,"O Senhor dos Exércitos está conosco; o Deus de Jacó é o nosso refúgio. (Selá.)"],[0,47,1,"Batei palmas, todos os povos; aclamai a Deus com voz de triunfo."],[0,47,2,"Porque o Senhor Altíssimo é tremendo, e Rei grande sobre toda a terra."],[0,47,3,"Ele nos subjugará os povos e as nações debaixo dos nossos pés."],[0,47,4,"Escolherá para nós a nossa herança, a glória de Jacó, a quem amou. (Selá.)"],[0,47,5,"Deus subiu com júbilo, o Senhor subiu ao som de trombeta."],[0,47,6,"Cantai louvores a Deus, cantai louvores; cantai louvores ao nosso Rei, cantai louvores."],[0,47,7,"Pois Deus é o Rei de toda a terra, cantai louvores com inteligência."],[0,47,8,"Deus reina sobre os gentios; Deus se assenta sobre o trono da sua santidade."],[0,47,9,"Os príncipes do povo se ajuntam, o povo do Deus de Abraão; porque os escudos da terra são de Deus. Ele está muito elevado!"],[0,48,9,"Lembramo-nos, ó Deus, da tua benignidade, no meio do teu templo."],[0,48,10,"Segundo é o teu nome, ó Deus, assim é o teu louvor, até aos fins da terra; a tua mão direita está cheia de justiça."],[0,48,11,"Alegre-se o monte de Sião; alegrem-se as filhas de Judá por causa dos teus juízos."],[0,48,12,"Rodeai Sião, e cercai-a, contai as suas torres."],[0,48,13,"Marcai bem os seus antemuros, considerai os seus palácios, para que o conteis à geração seguinte."],[0,48,14,"Porque este Deus é o nosso Deus para sempre; ele será nosso guia até à morte."],[0,51,10,"Cria em mim, ó Deus, um coração puro, e renova em mim um espírito reto."],[0,51,11,"Não me lances fora da tua presença, e não retires de mim o teu Espírito Santo."],[0,51,12,"Torna a dar-me a alegria da tua salvação, e sustém-me com um espírito voluntário."],[0,55,22,"Lança o teu cuidado sobre o Senhor, e ele te susterá; não permitirá jamais que o justo seja abalado."],[0,56,3,"Em qualquer tempo em que eu temer, confiarei em ti."],[0,56,4,"Em Deus louvarei a sua palavra, em Deus pus a minha confiança; não temerei o que me possa fazer a carne."],[0,57,7,"Preparado está o meu coração, ó Deus, preparado está o meu coração; cantarei, e darei louvores."],[0,57,8,"Desperta, glória minha; despertai, saltério e harpa; eu mesmo despertarei ao romper da alva."],[0,57,9,"Louvar-te-ei, Senhor, entre os povos; eu te cantarei entre as nações."],[0,57,10,"Pois a tua misericórdia é grande até aos céus, e a tua verdade até às nuvens."],[0,57,11,"Sê exaltado, ó Deus, sobre os céus; e seja a tua glória sobre toda a terra."],[0,61,1,"Ouve, ó Deus, o meu clamor; atende à minha oração."],[0,61,2,"Desde o fim da terra clamarei a ti, quando o meu coração estiver desmaiado; leva-me para a rocha que é mais alta do que eu."],[0,61,3,"Pois tens sido um refúgio para mim, e uma torre forte contra o inimigo."],[0,61,4,"Habitarei no teu tabernáculo para sempre; abrigar-me-ei no esconderijo das tuas asas. (Selá.)"],[0,61,5,"Pois tu, ó Deus, ouviste os meus votos; deste-me a herança dos que temem o teu nome."],[0,61,6,"Prolongarás os dias do rei; e os seus anos serão como muitas gerações."],[0,61,7,"Ele permanecerá diante de Deus para sempre; prepara-lhe misericórdia e verdade que o preservem."],[0,61,8,"Assim cantarei louvores ao teu nome perpetuamente, para pagar os meus votos de dia em dia."],[0,62,1,"A minha alma espera somente em Deus; dele vem a minha salvação."],[0,62,2,"Só ele é a minha rocha e a minha salvação; é a minha defesa; não serei grandemente abalado."],[0,62,3,"Até quando maquinareis o mal contra um homem? Sereis mortos todos vós, sereis como uma parede encurvada e uma sebe prestes a cair."],[0,62,5,"Ó minha alma, espera somente em Deus, porque dele vem a minha esperança."],[0,62,6,"Só ele é a minha rocha e a minha salvação; é a minha defesa; não serei abalado."],[0,62,7,"Em Deus está a minha salvação e a minha glória; a rocha da minha fortaleza, e o meu refúgio estão em Deus."],[0,62,8,"Confiai nele, ó povo, em todos os tempos; derramai perante ele o vosso coração. Deus é o nosso refúgio. (Selá.)"],[0,62,9,"Certamente que os homens de classe baixa são vaidade, e os homens de ordem elevada são mentira; pesados em balanças, eles juntos são mais leves do que a vaidade."],[0,62,10,"Não confieis na opressão, nem vos ensoberbeçais na rapina; se as vossas riquezas aumentam, não ponhais nelas o coração."],[0,62,11,"Deus falou uma vez; duas vezes ouvi isto: que o poder pertence a Deus."],[0,62,12,"A ti também, Senhor, pertence a misericórdia; pois retribuirás a cada um segundo a sua obra."],[0,63,1,"O Deus, tu és o meu Deus, de madrugada te buscarei; a minha alma tem sede de ti; a minha carne te deseja muito em uma terra seca e cansada, onde não há água;"],[0,63,2,"Para ver a tua força e a tua glória, como te vi no santuário."],[0,63,3,"Porque a tua benignidade é melhor do que a vida, os meus lábios te louvarão."],[0,63,4,"Assim eu te bendirei enquanto viver; em teu nome levantarei as minhas mãos."],[0,63,5,"A minha alma se fartará, como de tutano e de gordura; e a minha boca te louvará com alegres lábios,"],[0,63,6,"Quando me lembrar de ti na minha cama, e meditar em ti nas vigílias da noite."],[0,63,7,"Porque tu tens sido o meu auxílio; então, à sombra das tuas asas me regozijarei."],[0,63,8,"A minha alma te segue de perto; a tua destra me sustenta."],[0,63,9,"Mas aqueles que procuram a minha alma para a destruir, irão para as profundezas da terra."],[0,63,10,"Cairão à espada; serão uma ração para as raposas."],[0,63,11,"Mas o rei se regozijará em Deus; qualquer que por ele jurar se gloriará; porque se taparão as bocas dos que falam a mentira."],[0,65,1,"A ti, ó Deus, espera o louvor em Sião, e a ti se pagará o voto."],[0,65,2,"Ó tu que ouves as orações, a ti virá toda a carne."],[0,65,3,"Prevalecem as iniqüidades contra mim; porém tu limpas as nossas transgressões."],[0,65,4,"Bem-aventurado aquele a quem tu escolhes, e fazes chegar a ti, para que habite em teus átrios; nós seremos fartos da bondade da tua casa e do teu santo templo."],[0,65,5,"Com coisas tremendas em justiça nos responderás, ó Deus da nossa salvação; tu és a esperança de todas as extremidades da terra, e daqueles que estão longe sobre o mar."],[0,65,6,"O que pela sua força consolida os montes, cingido de fortaleza;"],[0,65,7,"O que aplaca o ruído dos mares, o ruído das suas ondas, e o tumulto dos povos."],[0,65,8,"E os que habitam nos fins da terra temem os teus sinais; tu fazes alegres as saídas da manhã e da tarde."],[0,65,9,"Tu visitas a terra, e a refrescas; tu a enriqueces grandemente com o rio de Deus, que está cheio de água; tu lhe preparas o trigo, quando assim a tens preparada."],[0,65,10,"Enches de água os seus sulcos; tu lhe aplanas as leivas; tu a amoleces com a muita chuva; abençoas as suas novidades."],[0,65,11,"Coroas o ano com a tua bondade, e as tuas veredas destilam gordura."],[0,65,12,"Destilam sobre os pastos do deserto, e os outeiros os cingem de alegria."],[0,65,13,"Os campos se vestem de rebanhos, e os vales se cobrem de trigo; eles se regozijam e cantam."],[0,66,1,"Celebrai com júbilo a Deus, todas as terras."],[0,66,2,"Cantai a glória do seu nome; dai glória ao seu louvor."],[0,66,3,"Dizei a Deus: Quão tremendo és tu nas tuas obras! Pela grandeza do teu poder se submeterão a ti os teus inimigos."],[0,66,4,"Todos os moradores da terra te adorarão e te cantarão; cantarão o teu nome. (Selá.)"],[0,66,5,"Vinde, e vede as obras de Deus: é tremendo nos seus feitos para com os filhos dos homens."],[0,66,6,"Converteu o mar em terra seca; passaram o rio a pé; ali nos alegramos nele."],[0,66,7,"Ele domina eternamente pelo seu poder; os seus olhos estão sobre as nações; não se exaltem os rebeldes. (Selá.)"],[0,66,8,"Bendizei, povos, ao nosso Deus, e fazei ouvir a voz do seu louvor,"],[0,66,9,"Ao que sustenta com vida a nossa alma, e não consente que sejam abalados os nossos pés."],[0,67,1,"Deus tenha misericórdia de nós e nos abençoe; e faça resplandecer o seu rosto sobre nós (Selá.)"],[0,67,2,"Para que se conheça na terra o teu caminho, e entre todas as nações a tua salvação."],[0,67,3,"Louvem-te a ti, ó Deus, os povos; louvem-te os povos todos."],[0,67,4,"Alegrem-se e regozijem-se as nações, pois julgarás os povos com eqüidade, e governarás as nações sobre a terra. (Selá.)"],[0,67,5,"Louvem-te a ti, ó Deus, os povos; louvem-te os povos todos."],[0,67,6,"Então a terra dará o seu fruto; e Deus, o nosso Deus, nos abençoará."],[0,67,7,"Deus nos abençoará, e todas as extremidades da terra o temerão."],[0,68,19,"Bendito seja o Senhor, que de dia em dia nos carrega de benefícios; o Deus que é a nossa salvação. (Selá.)."],[0,68,20,"O nosso Deus é o Deus da salvação; e a DEUS, o Senhor, pertencem os livramentos da morte."],[0,71,1,"Em ti, SENHOR, confio; nunca seja eu confundido."],[0,71,2,"Livra-me na tua justiça, e faze-me escapar; inclina os teus ouvidos para mim, e salva-me."],[0,71,3,"Sê tu a minha habitação forte, à qual possa recorrer continuamente. Deste um mandamento que me salva, pois tu és a minha rocha e a minha fortaleza."],[0,71,4,"Livra-me, meu Deus, das mãos do ímpio, das mãos do homem injusto e cruel."],[0,71,5,"Pois tu és a minha esperança, Senhor DEUS; tu és a minha confiança desde a minha mocidade."],[0,71,6,"Por ti tenho sido sustentado desde o ventre; tu és aquele que me tiraste das entranhas de minha mãe; o meu louvor será para ti constantemente."],[0,71,7,"Sou como um prodígio para muitos, mas tu és o meu refúgio forte."],[0,71,8,"Encha-se a minha boca do teu louvor e da tua glória todo o dia."],[0,84,1,"Quão amáveis são os teus tabernáculos, SENHOR dos Exércitos!"],[0,84,2,"A minha alma está desejosa, e desfalece pelos átrios do Senhor; o meu coração e a minha carne clamam pelo Deus vivo."],[0,84,3,"Até o pardal encontrou casa, e a andorinha ninho para si, onde ponha seus filhos, até mesmo nos teus altares, Senhor dos Exércitos, Rei meu e Deus meu."],[0,84,4,"Bem-aventurados os que habitam em tua casa; louvar-te-ão continuamente. (Selá.)"],[0,84,5,"Bem-aventurado o homem cuja força está em ti, em cujo coração estão os caminhos aplanados."],[0,84,6,"Que, passando pelo vale de Baca, faz dele uma fonte; a chuva também enche os tanques."],[0,84,7,"Vão indo de força em força; cada um deles em Sião aparece perante Deus."],[0,84,8,"Senhor Deus dos Exércitos, escuta a minha oração; inclina os ouvidos, ó Deus de Jacó! (Selá.)"],[0,84,9,"Olha, ó Deus, escudo nosso, e contempla o rosto do teu ungido."],[0,84,10,"Porque vale mais um dia nos teus átrios do que mil. Preferiria estar à porta da casa do meu Deus, a habitar nas tendas dos ímpios."],[0,84,11,"Porque o Senhor Deus é um sol e escudo; o Senhor dará graça e glória; não retirará bem algum aos que andam na retidão."],[0,84,12,"Senhor dos Exércitos, bem-aventurado o homem que em ti põe a sua confiança."],[0,85,8,"Escutarei o que Deus, o Senhor, falar; porque falará de paz ao seu povo, e aos santos, para que não voltem à loucura."],[0,85,9,"Certamente que a salvação está perto daqueles que o temem, para que a glória habite na nossa terra."],[0,85,10,"A misericórdia e a verdade se encontraram; a justiça e a paz se beijaram."],[0,85,11,"A verdade brotará da terra, e a justiça olhará desde os céus."],[0,85,12,"Também o Senhor dará o que é bom, e a nossa terra dará o seu fruto."],[0,85,13,"A justiça irá adiante dele, e nos porá no caminho das suas pisadas."],[0,86,5,"Pois tu, Senhor, és bom, e pronto a perdoar, e abundante em benignidade para todos os que te invocam."],[0,86,6,"Dá ouvidos, Senhor, à minha oração e atende à voz das minhas súplicas."],[0,86,7,"No dia da minha angústia clamo a ti, porquanto me respondes."],[0,86,8,"Entre os deuses não há semelhante a ti, Senhor, nem há obras como as tuas."],[0,86,9,"Todas as nações que fizeste virão e se prostrarão perante a tua face, Senhor, e glorificarão o teu nome."],[0,86,10,"Porque tu és grande e fazes maravilhas; só tu és Deus."],[0,86,11,"Ensina-me, Senhor, o teu caminho, e andarei na tua verdade; une o meu coração ao temor do teu nome."],[0,86,12,"Louvar-te-ei, Senhor Deus meu, com todo o meu coração, e glorificarei o teu nome para sempre."],[0,86,13,"Pois grande é a tua misericórdia para comigo; e livraste a minha alma do inferno mais profundo."],[0,90,12,"Ensina-nos a contar os nossos dias, de tal maneira que alcancemos corações sábios."],[0,90,13,"Volta-te para nós, Senhor; até quando? Aplaca-te para com os teus servos."],[0,90,14,"Farta-nos de madrugada com a tua benignidade, para que nos regozijemos, e nos alegremos todos os nossos dias."],[0,90,15,"Alegra-nos pelos dias em que nos afligiste, e pelos anos em que vimos o mal."],[0,90,16,"Apareça a tua obra aos teus servos, e a tua glória sobre seus filhos."],[0,90,17,"E seja sobre nós a formosura do Senhor nosso Deus, e confirma sobre nós a obra das nossas mãos; sim, confirma a obra das nossas mãos."],[0,91,1,"Aquele que habita no esconderijo do Altíssimo, à sombra do Onipotente descansará."],[0,91,2,"Direi do Senhor: Ele é o meu Deus, o meu refúgio, a minha fortaleza, e nele confiarei."],[0,91,3,"Porque ele te livrará do laço do passarinheiro, e da peste perniciosa."],[0,91,4,"Ele te cobrirá com as suas penas, e debaixo das suas asas te confiarás; a sua verdade será o teu escudo e broquel."],[0,91,5,"Não terás medo do terror de noite nem da seta que voa de dia,."],[0,91,6,"Nem da peste que anda na escuridão, nem da mortandade que assola ao meio-dia."],[0,91,7,"Mil cairão ao teu lado, e dez mil à tua direita, mas não chegará a ti."],[0,91,8,"Somente com os teus olhos contemplarás, e verás a recompensa dos ímpios."],[0,91,9,"Porque tu, ó Senhor, és o meu refúgio. No Altíssimo fizeste a tua habitação."],[0,91,10,"Nenhum mal te sucederá, nem praga alguma chegará à tua tenda."],[0,91,11,"Porque aos seus anjos dará ordem a teu respeito, para te guardarem em todos os teus caminhos."],[0,91,12,"Eles te sustentarão nas suas mãos, para que não tropeces com o teu pé em pedra."],[0,91,13,"Pisarás o leão e a cobra; calcarás aos pés o filho do leão e a serpente."],[0,91,14,"Porquanto tão encarecidamente me amou, também eu o livrarei; pô-lo-ei em retiro alto, porque conheceu o meu nome."],[0,91,15,"Ele me invocará, e eu lhe responderei; estarei com ele na angústia; dela o retirarei, e o glorificarei."],[0,91,16,"Fartá-lo-ei com longura de dias, e lhe mostrarei a minha salvação."],[0,92,1,"Bom é louvar ao SENHOR, e cantar louvores ao teu nome, ó Altíssimo;"],[0,92,2,"Para de manhã anunciar a tua benignidade, e todas as noites a tua fidelidade;"],[0,92,3,"Sobre um instrumento de dez cordas, e sobre o saltério; sobre a harpa com som solene."],[0,92,4,"Pois tu, Senhor, me alegraste pelos teus feitos; exultarei nas obras das tuas mãos."],[0,92,5,"Quão grandes são, Senhor, as tuas obras! Mui profundos são os teus pensamentos."],[0,93,1,"O SENHOR reina; está vestido de majestade. O SENHOR se revestiu e cingiu de poder; o mundo também está firmado, e não poderá vacilar."],[0,93,2,"O teu trono está firme desde então; tu és desde a eternidade."],[0,93,3,"Os rios levantam, ó Senhor, os rios levantam o seu ruído, os rios levantam as suas ondas."],[0,93,4,"Mas o Senhor nas alturas é mais poderoso do que o ruído das grandes águas e do que as grandes ondas do mar."],[0,93,5,"Mui fiéis são os teus testemunhos; a santidade convém à tua casa, Senhor, para sempre."],[0,94,18,"Quando eu disse: O meu pé vacila; a tua benignidade, Senhor, me susteve."],[0,94,19,"Na multidão dos meus pensamentos dentro de mim, as tuas consolações recrearam a minha alma."],[0,95,1,"Vinde, cantemos ao SENHOR; jubilemos à rocha da nossa salvação."],[0,95,2,"Apresentemo-nos ante a sua face com louvores, e celebremo-lo com salmos."],[0,95,3,"Porque o Senhor é Deus grande, e Rei grande sobre todos os deuses."],[0,95,4,"Nas suas mãos estão as profundezas da terra, e as alturas dos montes são suas."],[0,95,5,"Seu é o mar, e ele o fez, e as suas mãos formaram a terra seca."],[0,95,6,"Ó, vinde, adoremos e prostremo-nos; ajoelhemos diante do Senhor que nos criou."],[0,95,7,"Porque ele é o nosso Deus, e nós povo do seu pasto e ovelhas da sua mão. Se hoje ouvirdes a sua voz,"],[0,96,1,"Cantai ao SENHOR um cântico novo, cantai ao SENHOR toda a terra."],[0,96,2,"Cantai ao Senhor, bendizei o seu nome; anunciai a sua salvação de dia em dia."],[0,96,3,"Anunciai entre as nações a sua glória; entre todos os povos as suas maravilhas."],[0,96,4,"Porque grande é o Senhor, e digno de louvor, mais temível do que todos os deuses."],[0,96,5,"Porque todos os deuses dos povos são ídolos, mas o Senhor fez os céus."],[0,96,6,"Glória e majestade estão ante a sua face, força e formosura no seu santuário."],[0,96,7,"Dai ao Senhor, ó famílias dos povos, dai ao Senhor glória e força."],[0,96,8,"Dai ao Senhor a glória devida ao seu nome; trazei oferenda, e entrai nos seus átrios."],[0,96,9,"Adorai ao Senhor na beleza da santidade; tremei diante dele toda a terra."],[0,96,10,"Dizei entre os gentios que o Senhor reina. O mundo também se firmará para que se não abale; julgará os povos com retidão."],[0,96,11,"Alegrem-se os céus, e regozije-se a terra; brame o mar e a sua plenitude."],[0,96,12,"Alegre-se o campo com tudo o que há nele; então se regozijarão todas as árvores do bosque,"],[0,96,13,"Ante a face do Senhor, porque vem, porque vem a julgar a terra; julgará o mundo com justiça e os povos com a sua verdade."],[0,97,10,"Vós, que amais ao Senhor, odiai o mal. Ele guarda as almas dos seus santos; ele os livra das mãos dos ímpios."],[0,97,11,"A luz semeia-se para o justo, e a alegria para os retos de coração."],[0,97,12,"Alegrai-vos, ó justos, no Senhor, e dai louvores à memória da sua santidade."],[0,98,1,"Cantai ao SENHOR um cântico novo, porque fez maravilhas; a sua destra e o seu braço santo lhe alcançaram a salvação."],[0,98,2,"O Senhor fez notória a sua salvação, manifestou a sua justiça perante os olhos dos gentios."],[0,98,3,"Lembrou-se da sua benignidade e da sua verdade para com a casa de Israel; todas as extremidades da terra viram a salvação do nosso Deus."],[0,98,4,"Exultai no Senhor toda a terra; exclamai e alegrai-vos de prazer, e cantai louvores."],[0,98,5,"Cantai louvores ao Senhor com a harpa; com a harpa e a voz do canto."],[0,98,6,"Com trombetas e som de cornetas, exultai perante a face do Senhor, do Rei."],[0,98,7,"Brame o mar e a sua plenitude; o mundo, e os que nele habitam."],[0,98,8,"Os rios batam as palmas; regozijem-se também as montanhas,"],[0,98,9,"Perante a face do Senhor, porque vem a julgar a terra; com justiça julgará o mundo, e o povo com eqüidade."],[0,100,1,"Celebrai com júbilo ao SENHOR, todas as terras."],[0,100,2,"Servi ao Senhor com alegria; e entrai diante dele com canto."],[0,100,3,"Sabei que o Senhor é Deus; foi ele que nos fez, e não nós a nós mesmos; somos povo seu e ovelhas do seu pasto."],[0,100,4,"Entrai pelas portas dele com gratidão, e em seus átrios com louvor; louvai-o, e bendizei o seu nome."],[0,100,5,"Porque o Senhor é bom, e eterna a sua misericórdia; e a sua verdade dura de geração em geração."],[0,103,1,"Bendize, ó minha alma, ao SENHOR, e tudo o que há em mim bendiga o seu santo nome."],[0,103,2,"Bendize, ó minha alma, ao Senhor, e não te esqueças de nenhum de seus benefícios."],[0,103,3,"Ele é o que perdoa todas as tuas iniqüidades, que sara todas as tuas enfermidades,"],[0,103,4,"Que redime a tua vida da perdição; que te coroa de benignidade e de misericórdia,"],[0,103,5,"Que farta a tua boca de bens, de sorte que a tua mocidade se renova como a da águia."],[0,103,6,"O Senhor faz justiça e juízo a todos os oprimidos."],[0,103,7,"Fez conhecidos os seus caminhos a Moisés, e os seus feitos aos filhos de Israel."],[0,103,8,"Misericordioso e piedoso é o Senhor; longânimo e grande em benignidade."],[0,103,10,"Não nos tratou segundo os nossos pecados, nem nos recompensou segundo as nossas iniqüidades."],[0,103,11,"Pois assim como o céu está elevado acima da terra, assim é grande a sua misericórdia para com os que o temem."],[0,103,12,"Assim como está longe o oriente do ocidente, assim afasta de nós as nossas transgressões."],[0,103,13,"Assim como um pai se compadece de seus filhos, assim o Senhor se compadece daqueles que o temem."],[0,103,14,"Pois ele conhece a nossa estrutura; lembra-se de que somos pó."],[0,103,15,"Quanto ao homem, os seus dias são como a erva, como a flor do campo assim floresce."],[0,103,16,"Passando por ela o vento, logo se vai, e o seu lugar não será mais conhecido."],[0,103,17,"Mas a misericórdia do Senhor é desde a eternidade e até a eternidade sobre aqueles que o temem, e a sua justiça sobre os filhos dos filhos;"],[0,103,18,"Sobre aqueles que guardam a sua aliança, e sobre os que se lembram dos seus mandamentos para os cumprir."],[0,103,19,"O Senhor tem estabelecido o seu trono nos céus, e o seu reino domina sobre tudo."],[0,103,20,"Bendizei ao Senhor, todos os seus anjos, vós que excedeis em força, que guardais os seus mandamentos, obedecendo à voz da sua palavra."],[0,103,21,"Bendizei ao Senhor, todos os seus exércitos, vós ministros seus, que executais o seu beneplácito."],[0,103,22,"Bendizei ao Senhor, todas as suas obras, em todos os lugares do seu domínio; bendize, ó minha alma, ao Senhor."],[0,104,1,"Bendize, ó minha alma, ao SENHOR! SENHOR Deus meu, tu és magnificentíssimo; estás vestido de glória e de majestade."],[0,104,2,"Ele se cobre de luz como de um vestido, estende os céus como uma cortina."],[0,104,3,"Põe nas águas as vigas das suas câmaras; faz das nuvens o seu carro, anda sobre as asas do vento."],[0,104,4,"Faz dos seus anjos espíritos, dos seus ministros um fogo abrasador."],[0,104,5,"Lançou os fundamentos da terra; ela não vacilará em tempo algum."],[0,105,1,"Louvai ao SENHOR, e invocai o seu nome; fazei conhecidas as suas obras entre os povos."],[0,105,2,"Cantai-lhe, cantai-lhe salmos; falai de todas as suas maravilhas."],[0,105,3,"Gloriai-vos no seu santo nome; alegre-se o coração daqueles que buscam ao Senhor."],[0,105,4,"Buscai ao Senhor e a sua força; buscai a sua face continuamente."],[0,105,5,"Lembrai-vos das maravilhas que fez, dos seus prodígios e dos juízos da sua boca;"],[0,107,1,"Louvai ao SENHOR, porque ele é bom, porque a sua benignidade dura para sempre."],[0,107,2,"Digam-no os remidos do Senhor, os que remiu da mão do inimigo,"],[0,107,3,"E os que congregou das terras do oriente e do ocidente, do norte e do sul."],[0,107,4,"Andaram desgarrados pelo deserto, por caminhos solitários; não acharam cidade para habitarem."],[0,107,5,"Famintos e sedentos, a sua alma neles desfalecia."],[0,107,6,"E clamaram ao Senhor na sua angústia, e os livrou das suas dificuldades."],[0,107,7,"E os levou por caminho direito, para irem a uma cidade de habitação."],[0,107,8,"Louvem ao Senhor pela sua bondade, e pelas suas maravilhas para com os filhos dos homens."],[0,107,9,"Pois fartou a alma sedenta, e encheu de bens a alma faminta."],[0,111,1,"Louvai ao SENHOR. Louvarei ao SENHOR de todo o meu coração, na assembléia dos justos e na congregação."],[0,111,2,"Grandes são as obras do Senhor, procuradas por todos os que nelas tomam prazer."],[0,111,3,"A sua obra tem glória e majestade, e a sua justiça permanece para sempre."],[0,111,4,"Fez com que as suas maravilhas fossem lembradas; piedoso e misericordioso é o Senhor."],[0,111,5,"Deu mantimento aos que o temem; lembrar-se-á sempre da sua aliança."],[0,111,6,"Anunciou ao seu povo o poder das suas obras, para lhe dar a herança dos gentios."],[0,111,7,"As obras das suas mãos são verdade e juízo, seguros todos os seus mandamentos."],[0,111,8,"Permanecem firmes para todo o sempre; e são feitos em verdade e retidão."],[0,111,9,"Redenção enviou ao seu povo; ordenou a sua aliança para sempre; santo e tremendo é o seu nome."],[0,111,10,"O temor do Senhor é o princípio da sabedoria; bom entendimento têm todos os que cumprem os seus mandamentos; o seu louvor permanece para sempre."],[0,112,1,"Louvai ao SENHOR. Bem-aventurado o homem que teme ao SENHOR, que em seus mandamentos tem grande prazer."],[0,112,2,"A sua semente será poderosa na terra; a geração dos retos será abençoada."],[0,112,3,"Prosperidade e riquezas haverá na sua casa, e a sua justiça permanece para sempre."],[0,112,4,"Aos justos nasce luz nas trevas; ele é piedoso, misericordioso e justo."],[0,112,5,"O homem bom se compadece, e empresta; disporá as suas coisas com juízo;"],[0,112,6,"Porque nunca será abalado; o justo estará em memória eterna."],[0,112,7,"Não temerá maus rumores; o seu coração está firme, confiando no Senhor."],[0,112,8,"O seu coração está bem confirmado, ele não temerá, até que veja o seu desejo sobre os seus inimigos."],[0,112,9,"Ele espalhou, deu aos necessitados; a sua justiça permanece para sempre, e a sua força se exaltará em glória."],[0,113,1,"Louvai ao SENHOR. Louvai, servos do SENHOR, louvai o nome do SENHOR."],[0,113,2,"Seja bendito o nome do Senhor, desde agora para sempre."],[0,113,3,"Desde o nascimento do sol até ao ocaso, seja louvado o nome do Senhor."],[0,113,4,"Exaltado está o Senhor acima de todas as nações, e a sua glória sobre os céus."],[0,113,5,"Quem é como o Senhor nosso Deus, que habita nas alturas?"],[0,113,6,"O qual se inclina, para ver o que está nos céus e na terra!"],[0,113,7,"Levanta o pobre do pó e do monturo levanta o necessitado,"],[0,113,8,"Para o fazer assentar com os príncipes, mesmo com os príncipes do seu povo."],[0,113,9,"Faz com que a mulher estéril habite em casa, e seja alegre mãe de filhos. Louvai ao Senhor."],[0,115,9,"Israel, confia no Senhor; ele é o seu auxílio e o seu escudo."],[0,115,10,"Casa de Arão, confia no Senhor; ele é o seu auxílio e o seu escudo."],[0,115,11,"Vós, os que temeis ao Senhor, confiai no Senhor; ele é o seu auxílio e o seu escudo."],[0,115,12,"O Senhor se lembrou de nós; ele nos abençoará; abençoará a casa de Israel; abençoará a casa de Arão."],[0,115,13,"Abençoará os que temem ao Senhor, tanto pequenos como grandes."],[0,115,14,"O Senhor vos aumentará cada vez mais, a vós e a vossos filhos."],[0,115,15,"Sois benditos do Senhor, que fez os céus e a terra."],[0,116,1,"Amo ao SENHOR, porque ele ouviu a minha voz e a minha súplica."],[0,116,2,"Porque inclinou a mim os seus ouvidos; portanto, o invocarei enquanto viver."],[0,116,3,"Os cordéis da morte me cercaram, e angústias do inferno se apoderaram de mim; encontrei aperto e tristeza."],[0,116,4,"Então invoquei o nome do Senhor, dizendo: Ó Senhor, livra a minha alma."],[0,116,5,"Piedoso é o Senhor e justo; o nosso Deus tem misericórdia."],[0,116,6,"O Senhor guarda aos símplices; fui abatido, mas ele me livrou."],[0,116,7,"Volta, minha alma, para o teu repouso, pois o Senhor te fez bem."],[0,116,8,"Porque tu livraste a minha alma da morte, os meus olhos das lágrimas, e os meus pés da queda."],[0,116,9,"Andarei perante a face do Senhor na terra dos viventes."],[0,117,1,"Louvai ao SENHOR todas as nações, louvai-o todos os povos."],[0,117,2,"Porque a sua benignidade é grande para conosco, e a verdade do Senhor dura para sempre. Louvai ao Senhor."],[0,118,1,"Louvai ao SENHOR, porque ele é bom, porque a sua benignidade dura para sempre."],[0,118,2,"Diga agora Israel que a sua benignidade dura para sempre."],[0,118,3,"Diga agora a casa de Arão que a sua benignidade dura para sempre."],[0,118,4,"Digam agora os que temem ao Senhor que a sua benignidade dura para sempre."],[0,118,5,"Invoquei o Senhor na angústia; o Senhor me ouviu, e me tirou para um lugar largo."],[0,118,6,"O Senhor está comigo; não temerei o que me pode fazer o homem."],[0,118,7,"O Senhor está comigo entre aqueles que me ajudam; por isso verei cumprido o meu desejo sobre os que me odeiam."],[0,118,8,"É melhor confiar no Senhor do que confiar no homem."],[0,118,9,"É melhor confiar no Senhor do que confiar nos príncipes."],[0,118,14,"O Senhor é a minha força e o meu cântico; e se fez a minha salvação."],[0,118,15,"Nas tendas dos justos há voz de júbilo e de salvação; a destra do Senhor faz proezas."],[0,118,16,"A destra do Senhor se exalta; a destra do Senhor faz proezas."],[0,118,17,"Não morrerei, mas viverei; e contarei as obras do Senhor."],[0,118,19,"Abri-me as portas da justiça; entrarei por elas, e louvarei ao Senhor."],[0,118,20,"Esta é a porta do Senhor, pela qual os justos entrarão."],[0,118,21,"Louvar-te-ei, pois me escutaste, e te fizeste a minha salvação."],[0,118,22,"A pedra que os edificadores rejeitaram tornou-se a cabeça da esquina."],[0,118,23,"Da parte do Senhor se fez isto; maravilhoso é aos nossos olhos."],[0,118,24,"Este é o dia que fez o Senhor; regozijemo-nos, e alegremo-nos nele."],[0,118,25,"Salva-nos, agora, te pedimos, ó Senhor; ó Senhor, te pedimos, prospera-nos."],[0,118,26,"Bendito aquele que vem em nome do Senhor; nós vos bendizemos desde a casa do Senhor."],[0,118,27,"Deus é o Senhor que nos mostrou a luz; atai a vítima da festa com cordas, até às pontas do altar."],[0,118,28,"Tu és o meu Deus, e eu te louvarei; tu és o meu Deus, e eu te exaltarei."],[0,118,29,"Louvai ao Senhor, porque ele é bom; porque a sua benignidade dura para sempre."],[0,119,105,"Lâmpada para os meus pés é tua palavra, e luz para o meu caminho."],[0,119,106,"Jurei, e o cumprirei, que guardarei os teus justos juízos."],[0,119,107,"Estou aflitíssimo; vivifica-me, ó Senhor, segundo a tua palavra."],[0,119,108,"Aceita, eu te rogo, as oferendas voluntárias da minha boca, ó Senhor; ensina-me os teus juízos."],[0,119,109,"A minha alma está de contínuo nas minhas mãos; todavia não me esqueço da tua lei."],[0,119,110,"Os ímpios me armaram laço; contudo não me desviei dos teus preceitos."],[0,119,111,"Os teus testemunhos tenho eu tomado por herança para sempre, pois são o gozo do meu coração."],[0,119,112,"Inclinei o meu coração a guardar os teus estatutos, para sempre, até ao fim."],[0,121,1,"Levantarei os meus olhos para os montes, de onde vem o meu socorro."],[0,121,2,"O meu socorro vem do Senhor que fez o céu e a terra."],[0,121,3,"Não deixará vacilar o teu pé; aquele que te guarda não tosquenejará."],[0,121,4,"Eis que não tosquenejará nem dormirá o guarda de Israel."],[0,121,5,"O Senhor é quem te guarda; o Senhor é a tua sombra à tua direita."],[0,121,6,"O sol não te molestará de dia nem a lua de noite."],[0,121,7,"O Senhor te guardará de todo o mal; guardará a tua alma."],[0,121,8,"O Senhor guardará a tua entrada e a tua saída, desde agora e para sempre."],[0,122,1,"Alegrei-me quando me disseram: Vamos á casa do SENHOR."],[0,122,2,"Os nossos pés estão dentro das tuas portas, ó Jerusalém."],[0,122,3,"Jerusalém está edificada como uma cidade que é compacta."],[0,122,4,"Onde sobem as tribos, as tribos do Senhor, até ao testemunho de Israel, para darem graças ao nome do Senhor."],[0,122,5,"Pois ali estão os tronos do juízo, os tronos da casa de Davi."],[0,122,6,"Orai pela paz de Jerusalém; prosperarão aqueles que te amam."],[0,122,7,"Haja paz dentro de teus muros, e prosperidade dentro dos teus palácios."],[0,122,8,"Por causa dos meus irmãos e amigos, direi: Paz esteja em ti."],[0,122,9,"Por causa da casa do Senhor nosso Deus, buscarei o teu bem."],[0,125,1,"Os que confiam no SENHOR serão como o monte de Sião, que não se abala, mas permanece para sempre."],[0,125,2,"Assim como estão os montes à roda de Jerusalém, assim o Senhor está em volta do seu povo desde agora e para sempre."],[0,126,1,"Quando o SENHOR trouxe do cativeiro os que voltaram a Sião, estávamos como os que sonham."],[0,126,2,"Então a nossa boca se encheu de riso e a nossa língua de cântico; então se dizia entre os gentios: Grandes coisas fez o Senhor a estes."],[0,126,3,"Grandes coisas fez o Senhor por nós, pelas quais estamos alegres."],[0,126,4,"Traze-nos outra vez, ó Senhor, do cativeiro, como as correntes das águas no sul."],[0,126,5,"Os que semeiam em lágrimas segarão com alegria."],[0,126,6,"Aquele que leva a preciosa semente, andando e chorando, voltará, sem dúvida, com alegria, trazendo consigo os seus molhos."],[0,127,1,"Se o SENHOR não edificar a casa, em vão trabalham os que a edificam; se o SENHOR não guardar a cidade, em vão vigia a sentinela."],[0,127,2,"Inútil vos será levantar de madrugada, repousar tarde, comer o pão de dores, pois assim dá ele aos seus amados o sono."],[0,128,1,"Bem-aventurado aquele que teme ao SENHOR e anda nos seus caminhos."],[0,128,2,"Pois comerás do trabalho das tuas mãos; feliz serás, e te irá bem."],[0,128,3,"A tua mulher será como a videira frutífera aos lados da tua casa; os teus filhos como plantas de oliveira à roda da tua mesa."],[0,128,4,"Eis que assim será abençoado o homem que teme ao Senhor."],[0,128,5,"O Senhor te abençoará desde Sião, e tu verás o bem de Jerusalém em todos os dias da tua vida."],[0,128,6,"E verás os filhos de teus filhos, e a paz sobre Israel."],[0,130,1,"Das profundezas a ti clamo, ó SENHOR."],[0,130,2,"Senhor, escuta a minha voz; sejam os teus ouvidos atentos à voz das minhas súplicas."],[0,130,3,"Se tu, Senhor, observares as iniqüidades, Senhor, quem subsistirá?"],[0,130,4,"Mas contigo está o perdão, para que sejas temido."],[0,130,5,"Aguardo ao Senhor; a minha alma o aguarda, e espero na sua palavra."],[0,130,6,"A minha alma anseia pelo Senhor, mais do que os guardas pela manhã, mais do que aqueles que guardam pela manhã."],[0,130,7,"Espere Israel no Senhor, porque no Senhor há misericórdia, e nele há abundante redenção."],[0,130,8,"E ele remirá a Israel de todas as suas iniqüidades."],[0,131,1,"SENHOR, o meu coração não se elevou nem os meus olhos se levantaram; não me exercito em grandes matérias, nem em coisas muito elevadas para mim."],[0,131,2,"Certamente que me tenho portado e sossegado como uma criança desmamada de sua mãe; a minha alma está como uma criança desmamada."],[0,131,3,"Espere Israel no Senhor, desde agora e para sempre."],[0,133,1,"Oh! quão bom e quão suave é que os irmãos vivam em união."],[0,133,2,"É como o óleo precioso sobre a cabeça, que desce sobre a barba, a barba de Arão, e que desce à orla das suas vestes."],[0,133,3,"Como o orvalho de Hermom, e como o que desce sobre os montes de Sião, porque ali o Senhor ordena a bênção e a vida para sempre."],[0,138,1,"Eu te louvarei, de todo o meu coração; na presença dos deuses a ti cantarei louvores."],[0,138,2,"Inclinar-me-ei para o teu santo templo, e louvarei o teu nome pela tua benignidade, e pela tua verdade; pois engrandeceste a tua palavra acima de todo o teu nome."],[0,138,3,"No dia em que eu clamei, me escutaste; e alentaste com força a minha alma."],[0,138,4,"Todos os reis da terra te louvarão, ó Senhor, quando ouvirem as palavras da tua boca;"],[0,138,5,"E cantarão os caminhos do Senhor; pois grande é a glória do Senhor."],[0,138,6,"Ainda que o Senhor é excelso, atenta todavia para o humilde; mas ao soberbo conhece-o de longe."],[0,138,8,"O Senhor aperfeiçoará o que me toca; a tua benignidade, ó Senhor, dura para sempre; não desampares as obras das tuas mãos."],[0,139,1,"SENHOR, tu me sondaste, e me conheces."],[0,139,2,"Tu sabes o meu assentar e o meu levantar; de longe entendes o meu pensamento."],[0,139,3,"Cercas o meu andar, e o meu deitar; e conheces todos os meus caminhos."],[0,139,4,"Não havendo ainda palavra alguma na minha língua, eis que logo, ó Senhor, tudo conheces."],[0,139,5,"Tu me cercaste por detrás e por diante, e puseste sobre mim a tua mão."],[0,139,6,"Tal ciência é para mim maravilhosíssima; tão alta que não a posso atingir."],[0,139,7,"Para onde me irei do teu espírito, ou para onde fugirei da tua face?"],[0,139,8,"Se subir ao céu, lá tu estás; se fizer no inferno a minha cama, eis que tu ali estás também."],[0,139,9,"Se tomar as asas da alva, se habitar nas extremidades do mar,"],[0,139,10,"Até ali a tua mão me guiará e a tua destra me susterá."],[0,139,11,"Se disser: Decerto que as trevas me encobrirão; então a noite será luz à roda de mim."],[0,139,12,"Nem ainda as trevas me encobrem de ti; mas a noite resplandece como o dia; as trevas e a luz são para ti a mesma coisa;"],[0,139,13,"Pois possuíste os meus rins; cobriste-me no ventre de minha mãe."],[0,139,14,"Eu te louvarei, porque de um modo assombroso, e tão maravilhoso fui feito; maravilhosas são as tuas obras, e a minha alma o sabe muito bem."],[0,139,15,"Os meus ossos não te foram encobertos, quando no oculto fui feito, e entretecido nas profundezas da terra."],[0,139,16,"Os teus olhos viram o meu corpo ainda informe; e no teu livro todas estas coisas foram escritas; as quais em continuação foram formadas, quando nem ainda uma delas havia."],[0,139,17,"E quão preciosos me são, ó Deus, os teus pensamentos! Quão grandes são as somas deles!"],[0,139,18,"Se as contasse, seriam em maior número do que a areia; quando acordo ainda estou contigo."],[0,139,23,"Sonda-me, ó Deus, e conhece o meu coração; prova-me, e conhece os meus pensamentos."],[0,139,24,"E vê se há em mim algum caminho mau, e guia-me pelo caminho eterno."],[0,143,8,"Faze-me ouvir a tua benignidade pela manhã, pois em ti confio; faze-me saber o caminho que devo seguir, porque a ti levanto a minha alma."],[0,143,9,"Livra-me, ó Senhor, dos meus inimigos; fujo para ti, para me esconder."],[0,143,10,"Ensina-me a fazer a tua vontade, pois és o meu Deus. O teu Espírito é bom; guie-me por terra plana."],[0,145,1,"Eu te exaltarei, ó Deus, rei meu, e bendirei o teu nome pelos séculos dos séculos e para sempre."],[0,145,2,"Cada dia te bendirei, e louvarei o teu nome pelos séculos dos séculos e para sempre."],[0,145,3,"Grande é o Senhor, e muito digno de louvor, e a sua grandeza inescrutável."],[0,145,4,"Uma geração louvará as tuas obras à outra geração, e anunciarão as tuas proezas."],[0,145,5,"Falarei da magnificência gloriosa da tua majestade e das tuas obras maravilhosas."],[0,145,6,"E se falará da força dos teus feitos terríveis; e contarei a tua grandeza."],[0,145,7,"Proferirão abundantemente a memória da tua grande bondade, e cantarão a tua justiça."],[0,145,8,"Piedoso e benigno é o Senhor, sofredor e de grande misericórdia."],[0,145,9,"O Senhor é bom para todos, e as suas misericórdias são sobre todas as suas obras."],[0,145,10,"Todas as tuas obras te louvarão, ó Senhor, e os teus santos te bendirão."],[0,145,11,"Falarão da glória do teu reino, e relatarão o teu poder,"],[0,145,12,"Para fazer saber aos filhos dos homens as tuas proezas e a glória da magnificência do teu reino."],[0,145,13,"O teu reino é um reino eterno; o teu domínio dura em todas as gerações."],[0,145,14,"O Senhor sustenta a todos os que caem, e levanta a todos os abatidos."],[0,145,15,"Os olhos de todos esperam em ti, e lhes dás o seu mantimento a seu tempo."],[0,145,16,"Abres a tua mão, e fartas os desejos de todos os viventes."],[0,145,17,"Justo é o Senhor em todos os seus caminhos, e santo em todas as suas obras."],[0,145,18,"Perto está o Senhor de todos os que o invocam, de todos os que o invocam em verdade."],[0,145,19,"Ele cumprirá o desejo dos que o temem; ouvirá o seu clamor, e os salvará."],[0,145,20,"O Senhor guarda a todos os que o amam; mas todos os ímpios serão destruídos."],[0,145,21,"A minha boca falará o louvor do Senhor, e toda a carne louvará o seu santo nome pelos séculos dos séculos e para sempre."],[0,146,5,"Bem-aventurado aquele que tem o Deus de Jacó por seu auxílio, e cuja esperança está posta no Senhor seu Deus."],[0,146,6,"O que fez os céus e a terra, o mar e tudo quanto há neles, e o que guarda a verdade para sempre;"],[0,146,7,"O que faz justiça aos oprimidos, o que dá pão aos famintos. O Senhor solta os encarcerados."],[0,146,8,"O Senhor abre os olhos aos cegos; o Senhor levanta os abatidos; o Senhor ama os justos;"],[0,146,9,"O Senhor guarda os estrangeiros; sustém o órfão e a viúva, mas transtorna o caminho dos ímpios."],[0,146,10,"O Senhor reinará eternamente; o teu Deus, ó Sião, de geração em geração. Louvai ao Senhor."],[0,147,1,"Louvai ao SENHOR, porque é bom cantar louvores ao nosso Deus, porque é agradável; decoroso é o louvor."],[0,147,2,"O Senhor edifica a Jerusalém, congrega os dispersos de Israel."],[0,147,3,"Sara os quebrantados de coração, e lhes ata as suas feridas."],[0,147,4,"Conta o número das estrelas, chama-as a todas pelos seus nomes."],[0,147,5,"Grande é o nosso Senhor, e de grande poder; o seu entendimento é infinito."],[0,147,6,"O Senhor eleva os humildes, e abate os ímpios até à terra."],[0,147,7,"Cantai ao Senhor em ação de graças; cantai louvores ao nosso Deus sobre a harpa."],[0,147,8,"Ele é o que cobre o céu de nuvens, o que prepara a chuva para a terra, e o que faz produzir erva sobre os montes;"],[0,147,9,"O que dá aos animais o seu sustento, e aos filhos dos corvos, quando clamam."],[0,147,10,"Não se deleita na força do cavalo, nem se compraz nas pernas do homem."],[0,147,11,"O Senhor se agrada dos que o temem e dos que esperam na sua misericórdia."],[0,148,1,"Louvai ao SENHOR. Louvai ao SENHOR desde os céus, louvai-o nas alturas."],[0,148,2,"Louvai-o, todos os seus anjos; louvai-o, todos os seus exércitos."],[0,148,3,"Louvai-o, sol e lua; louvai-o, todas as estrelas luzentes."],[0,148,4,"Louvai-o, céus dos céus, e as águas que estão sobre os céus."],[0,148,5,"Louvem o nome do Senhor, pois mandou, e logo foram criados."],[0,148,6,"E os confirmou eternamente para sempre, e lhes deu um decreto que não ultrapassarão."],[0,148,7,"Louvai ao Senhor desde a terra: vós, baleias, e todos os abismos;"],[0,148,8,"Fogo e saraiva, neve e vapores, e vento tempestuoso que executa a sua palavra;"],[0,148,9,"Montes e todos os outeiros, árvores frutíferas e todos os cedros;"],[0,148,10,"As feras e todos os gados, répteis e aves voadoras;"],[0,148,11,"Reis da terra e todos os povos, príncipes e todos os juízes da terra;"],[0,148,12,"Moços e moças, velhos e crianças."],[0,148,13,"Louvem o nome do Senhor, pois só o seu nome é exaltado; a sua glória está sobre a terra e o céu."],[0,148,14,"Ele também exalta o poder do seu povo, o louvor de todos os seus santos, dos filhos de Israel, um povo que lhe é chegado. Louvai ao Senhor."],[0,149,1,"Louvai ao SENHOR. Cantai ao SENHOR um cântico novo, e o seu louvor na congregação dos santos."],[0,149,2,"Alegre-se Israel naquele que o fez, regozijem-se os filhos de Sião no seu Rei."],[0,149,3,"Louvem o seu nome com danças; cantem-lhe o seu louvor com tamborim e harpa."],[0,149,4,"Porque o Senhor se agrada do seu povo; ornará os mansos com a salvação."],[0,149,5,"Exultem os santos na glória; alegrem-se nas suas camas."],[0,150,1,"Louvai ao SENHOR. Louvai a Deus no seu santuário; louvai-o no firmamento do seu poder."],[0,150,2,"Louvai-o pelos seus atos poderosos; louvai-o conforme a excelência da sua grandeza."],[0,150,3,"Louvai-o com o som de trombeta; louvai-o com o saltério e a harpa."],[0,150,4,"Louvai-o com o tamborim e a dança, louvai-o com instrumentos de cordas e com órgãos."],[0,150,5,"Louvai-o com os címbalos sonoros; louvai-o com címbalos altissonantes."],[0,150,6,"Tudo quanto tem fôlego louve ao Senhor. Louvai ao Senhor."],[1,3,1,"Filho meu, não te esqueças da minha lei, e o teu coração guarde os meus mandamentos."],[1,3,2,"Porque eles aumentarão os teus dias e te acrescentarão anos de vida e paz."],[1,3,3,"Não te desamparem a benignidade e a fidelidade; ata-as ao teu pescoço; escreve-as na tábua do teu coração."],[1,3,4,"E acharás graça e bom entendimento aos olhos de Deus e do homem."],[1,3,5,"Confia no Senhor de todo o teu coração, e não te estribes no teu próprio entendimento."],[1,3,6,"Reconhece-o em todos os teus caminhos, e ele endireitará as tuas veredas."],[1,3,7,"Não sejas sábio a teus próprios olhos; teme ao Senhor e aparta-te do mal."],[1,3,8,"Isto será saúde para o teu âmago, e medula para os teus ossos."],[1,3,13,"Bem-aventurado o homem que acha sabedoria, e o homem que adquire conhecimento;"],[1,3,14,"Porque é melhor a sua mercadoria do que artigos de prata, e maior o seu lucro que o ouro mais fino."],[1,3,15,"Mais preciosa é do que os rubis, e tudo o que mais possas desejar não se pode comparar a ela."],[1,3,16,"Vida longa de dias está na sua mão direita; e na esquerda, riquezas e honra."],[1,3,17,"Os seus caminhos são caminhos de delícias, e todas as suas veredas de paz."],[1,3,18,"É árvore de vida para os que dela tomam, e são bem-aventurados todos os que a retêm."],[1,3,21,"Filho meu, não se apartem estas coisas dos teus olhos: guarda a verdadeira sabedoria e o bom siso;"],[1,3,22,"Porque serão vida para a tua alma, e adorno ao teu pescoço."],[1,3,23,"Então andarás confiante pelo teu caminho, e o teu pé não tropeçará."],[1,3,24,"Quando te deitares, não temerás; ao contrário, o teu sono será suave ao te deitares."],[1,3,25,"Não temas o pavor repentino, nem a investida dos perversos quando vier."],[1,3,26,"Porque o Senhor será a tua esperança; guardará os teus pés de serem capturados."],[1,4,20,"Filho meu, atenta para as minhas palavras; às minhas razões inclina o teu ouvido."],[1,4,21,"Não as deixes apartar-se dos teus olhos; guarda-as no íntimo do teu coração."],[1,4,22,"Porque são vida para os que as acham, e saúde para todo o seu corpo."],[1,4,23,"Sobre tudo o que se deve guardar, guarda o teu coração, porque dele procedem as fontes da vida."],[1,4,24,"Desvia de ti a falsidade da boca, e afasta de ti a perversidade dos lábios."],[1,4,25,"Os teus olhos olhem para a frente, e as tuas pálpebras olhem direto diante de ti."],[1,4,26,"Pondera a vereda de teus pés, e todos os teus caminhos sejam bem ordenados!"],[1,4,27,"Não
