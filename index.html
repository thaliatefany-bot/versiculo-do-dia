 declines nem para a direita nem para a esquerda; retira o teu pé do mal."],[1,11,25,"A alma generosa prosperará e aquele que atende também será atendido."],[1,12,25,"A ansiedade no coração deixa o homem abatido, mas uma boa palavra o alegra."],[1,15,13,"O coração alegre aformoseia o rosto, mas pela dor do coração o espírito se abate."],[1,15,30,"A luz dos olhos alegra o coração, a boa notícia fortalece os ossos."],[1,16,3,"Confia ao Senhor as tuas obras, e teus pensamentos serão estabelecidos."],[1,16,9,"O coração do homem planeja o seu caminho, mas o Senhor lhe dirige os passos."],[1,16,24,"As palavras suaves são favos de mel, doces para a alma, e saúde para os ossos."],[1,17,17,"Em todo o tempo ama o amigo e para a hora da angústia nasce o irmão."],[1,17,22,"O coração alegre é como o bom remédio, mas o espírito abatido seca até os ossos."],[1,18,10,"Torre forte é o nome do Senhor; a ela correrá o justo, e estará em alto refúgio."],[1,18,24,"O homem de muitos amigos deve mostrar-se amigável, mas há um amigo mais chegado do que um irmão."],[1,19,21,"Muitos propósitos há no coração do homem, porém o conselho do Senhor permanecerá."],[1,22,1,"Vale mais ter um bom nome do que muitas riquezas; e o ser estimado é melhor do que a riqueza e o ouro."],[1,22,6,"Educa a criança no caminho em que deve andar; e até quando envelhecer não se desviará dele."],[1,27,17,"Como o ferro com ferro se aguça, assim o homem afia o rosto do seu amigo."],[1,31,25,"A força e a honra são seu vestido, e se alegrará com o dia futuro."],[1,31,26,"Abre a sua boca com sabedoria, e a lei da beneficência está na sua língua."],[1,31,27,"Está atenta ao andamento da casa, e não come o pão da preguiça."],[1,31,28,"Levantam-se seus filhos e chamam-na bem-aventurada; seu marido também, e ele a louva."],[1,31,29,"Muitas filhas têm procedido virtuosamente, mas tu és, de todas, a mais excelente!"],[1,31,30,"Enganosa é a beleza e vã a formosura, mas a mulher que teme ao Senhor, essa sim será louvada."],[2,9,6,"Porque um menino nos nasceu, um filho se nos deu, e o principado está sobre os seus ombros, e se chamará o seu nome: Maravilhoso, Conselheiro, Deus Forte, Pai da Eternidade, Príncipe da Paz."],[2,12,2,"Eis que Deus é a minha salvação; nele confiarei, e não temerei, porque o SENHOR DEUS é a minha força e o meu cântico, e se tornou a minha salvação."],[2,12,3,"E vós com alegria tirareis águas das fontes da salvação."],[2,12,4,"E direis naquele dia: Dai graças ao Senhor, invocai o seu nome, fazei notório os seus feitos entre os povos, contai quão excelso é o seu nome."],[2,12,5,"Cantai ao Senhor, porque fez coisas grandiosas; saiba-se isto em toda a terra."],[2,12,6,"Exulta e jubila, ó habitante de Sião, porque grande é o Santo de Israel no meio de ti."],[2,26,3,"Tu conservarás em paz aquele cuja mente está firme em ti; porque ele confia em ti."],[2,26,4,"Confiai no SENHOR perpetuamente; porque o SENHOR DEUS é uma rocha eterna."],[2,30,15,"Porque assim diz o Senhor DEUS, o Santo de Israel: Voltando e descansando sereis salvos; no sossego e na confiança estaria a vossa força, mas não quisestes."],[2,30,18,"Por isso, o Senhor esperará, para ter misericórdia de vós; e por isso se levantará, para se compadecer de vós, porque o Senhor é um Deus de eqüidade; bem-aventurados todos os que nele esperam."],[2,30,19,"Porque o povo habitará em Sião, em Jerusalém; não chorarás mais; certamente se compadecerá de ti, à voz do teu clamor e, ouvindo-a, te responderá."],[2,30,20,"Bem vos dará o Senhor pão de angústia e água de aperto, mas os teus mestres nunca mais fugirão de ti, como voando com asas; antes os teus olhos verão a todos os teus mestres."],[2,30,21,"E os teus ouvidos ouvirão a palavra do que está por detrás de ti, dizendo: Este é o caminho, andai nele, sem vos desviardes nem para a direita nem para a esquerda."],[2,40,28,"Não sabes, não ouviste que o eterno Deus, o Senhor, o Criador dos fins da terra, nem se cansa nem se fatiga? É inescrutável o seu entendimento."],[2,40,29,"Dá força ao cansado, e multiplica as forças ao que não tem nenhum vigor."],[2,40,30,"Os jovens se cansarão e se fatigarão, e os moços certamente cairão;"],[2,40,31,"Mas os que esperam no Senhor renovarão as forças, subirão com asas como águias; correrão, e não se cansarão; caminharão, e não se fatigarão."],[2,41,10,"Não temas, porque eu sou contigo; não te assombres, porque eu sou teu Deus; eu te fortaleço, e te ajudo, e te sustento com a destra da minha justiça."],[2,41,13,"Porque eu, o Senhor teu Deus, te tomo pela tua mão direita; e te digo: Não temas, eu te ajudo."],[2,43,1,"Mas agora, assim diz o SENHOR que te criou, ó Jacó, e que te formou, ó Israel: Não temas, porque eu te remi; chamei-te pelo teu nome, tu és meu."],[2,43,2,"Quando passares pelas águas estarei contigo, e quando pelos rios, eles não te submergirão; quando passares pelo fogo, não te queimarás, nem a chama arderá em ti."],[2,43,3,"Porque eu sou o Senhor teu Deus, o Santo de Israel, o teu Salvador; dei o Egito por teu resgate, a Etiópia e a Seba em teu lugar."],[2,43,4,"Visto que foste precioso aos meus olhos, também foste honrado, e eu te amei, assim dei os homens por ti, e os povos pela tua vida."],[2,43,5,"Não temas, pois, porque estou contigo; trarei a tua descendência desde o oriente, e te ajuntarei desde o ocidente."],[2,43,18,"Não vos lembreis das coisas passadas, nem considereis as antigas."],[2,43,19,"Eis que faço uma coisa nova, agora sairá à luz; porventura não a percebeis? Eis que porei um caminho no deserto, e rios no ermo."],[2,44,3,"Porque derramarei água sobre o sedento, e rios sobre a terra seca; derramarei o meu Espírito sobre a tua posteridade, e a minha bênção sobre os teus descendentes."],[2,46,4,"E até à velhice eu serei o mesmo, e ainda até às cãs eu vos carregarei; eu vos fiz, e eu vos levarei, e eu vos trarei, e vos livrarei."],[2,49,15,"Porventura pode uma mulher esquecer-se tanto de seu filho que cria, que não se compadeça dele, do filho do seu ventre? Mas ainda que esta se esquecesse dele, contudo eu não me esquecerei de ti."],[2,49,16,"Eis que nas palmas das minhas mãos eu te gravei; os teus muros estão continuamente diante de mim."],[2,53,4,"Verdadeiramente ele tomou sobre si as nossas enfermidades, e as nossas dores levou sobre si; e nós o reputávamos por aflito, ferido de Deus, e oprimido."],[2,53,6,"Todos nós andávamos desgarrados como ovelhas; cada um se desviava pelo seu caminho; mas o Senhor fez cair sobre ele a iniqüidade de nós todos."],[2,54,10,"Porque os montes se retirarão, e os outeiros serão abalados; porém a minha benignidade não se apartará de ti, e a aliança da minha paz não mudará, diz o Senhor que se compadece de ti."],[2,55,1,"Ó VÓS, todos os que tendes sede, vinde às águas, e os que não tendes dinheiro, vinde, comprai, e comei; sim, vinde, comprai, sem dinheiro e sem preço, vinho e leite."],[2,55,2,"Por que gastais o dinheiro naquilo que não é pão? E o produto do vosso trabalho naquilo que não pode satisfazer? Ouvi-me atentamente, e comei o que é bom, e a vossa alma se deleite com a gordura."],[2,55,3,"Inclinai os vossos ouvidos, e vinde a mim; ouvi, e a vossa alma viverá; porque convosco farei uma aliança perpétua, dando-vos as firmes beneficências de Davi."],[2,55,6,"Buscai ao Senhor enquanto se pode achar, invocai-o enquanto está perto."],[2,55,7,"Deixe o ímpio o seu caminho, e o homem maligno os seus pensamentos, e se converta ao Senhor, que se compadecerá dele; torne para o nosso Deus, porque grandioso é em perdoar."],[2,55,8,"Porque os meus pensamentos não são os vossos pensamentos, nem os vossos caminhos os meus caminhos, diz o Senhor."],[2,55,9,"Porque assim como os céus são mais altos do que a terra, assim são os meus caminhos mais altos do que os vossos caminhos, e os meus pensamentos mais altos do que os vossos pensamentos."],[2,55,10,"Porque, assim como desce a chuva e a neve dos céus, e para lá não tornam, mas regam a terra, e a fazem produzir, e brotar, e dar semente ao semeador, e pão ao que come,"],[2,55,11,"Assim será a minha palavra, que sair da minha boca; ela não voltará para mim vazia, antes fará o que me apraz, e prosperará naquilo para que a enviei."],[2,55,12,"Porque com alegria saireis, e em paz sereis guiados; os montes e os outeiros romperão em cântico diante de vós, e todas as árvores do campo baterão palmas."],[2,55,13,"Em lugar do espinheiro crescerá a faia, e em lugar da sarça crescerá a murta; o que será para o Senhor por nome, e por sinal eterno, que nunca se apagará."],[2,58,8,"Então romperá a tua luz como a alva, e a tua cura apressadamente brotará, e a tua justiça irá adiante de ti, e a glória do Senhor será a tua retaguarda."],[2,58,9,"Então clamarás, e o Senhor te responderá; gritarás, e ele dirá: Eis-me aqui. Se tirares do meio de ti o jugo, o estender do dedo, e o falar iniquamente;"],[2,58,10,"E se abrires a tua alma ao faminto, e fartares a alma aflita; então a tua luz nascerá nas trevas, e a tua escuridão será como o meio-dia."],[2,58,11,"E o Senhor te guiará continuamente, e fartará a tua alma em lugares áridos, e fortificará os teus ossos; e serás como um jardim regado, e como um manancial, cujas águas nunca faltam."],[2,60,1,"Levanta-te, resplandece, porque vem a tua luz, e a glória do SENHOR vai nascendo sobre ti;"],[2,61,1,"O espírito do Senhor DEUS está sobre mim; porque o SENHOR me ungiu, para pregar boas novas aos mansos; enviou-me a restaurar os contritos de coração, a proclamar liberdade aos cativos, e a abertura de prisão aos presos;"],[2,61,2,"A apregoar o ano aceitável do Senhor e o dia da vingança do nosso Deus; a consolar todos os tristes;"],[2,61,3,"A ordenar acerca dos tristes de Sião que se lhes dê glória em vez de cinza, óleo de gozo em vez de tristeza, vestes de louvor em vez de espírito angustiado; a fim de que se chamem árvores de justiça, plantações do Senhor, para que ele seja glorificado."],[2,61,10,"Regozijar-me-ei muito no Senhor, a minha alma se alegrará no meu Deus; porque me vestiu de roupas de salvação, cobriu-me com o manto de justiça, como um noivo se adorna com turbante sacerdotal, e como a noiva que se enfeita com as suas jóias."],[2,65,24,"E será que antes que clamem eu responderei; estando eles ainda falando, eu os ouvirei."],[3,5,3,"Bem-aventurados os pobres de espírito, porque deles é o reino dos céus;"],[3,5,4,"Bem-aventurados os que choram, porque eles serão consolados;"],[3,5,5,"Bem-aventurados os mansos, porque eles herdarão a terra;"],[3,5,6,"Bem-aventurados os que têm fome e sede de justiça, porque eles serão fartos;"],[3,5,7,"Bem-aventurados os misericordiosos, porque eles alcançarão misericórdia;"],[3,5,8,"Bem-aventurados os limpos de coração, porque eles verão a Deus;"],[3,5,9,"Bem-aventurados os pacificadores, porque eles serão chamados filhos de Deus;"],[3,5,10,"Bem-aventurados os que sofrem perseguição por causa da justiça, porque deles é o reino dos céus;"],[3,5,11,"Bem-aventurados sois vós, quando vos injuriarem e perseguirem e, mentindo, disserem todo o mal contra vós por minha causa."],[3,5,12,"Exultai e alegrai-vos, porque é grande o vosso galardão nos céus; porque assim perseguiram os profetas que foram antes de vós."],[3,5,13,"Vós sois o sal da terra; e se o sal for insípido, com que se há de salgar? Para nada mais presta senão para se lançar fora, e ser pisado pelos homens."],[3,5,14,"Vós sois a luz do mundo; não se pode esconder uma cidade edificada sobre um monte;"],[3,5,15,"Nem se acende a candeia e se coloca debaixo do alqueire, mas no velador, e dá luz a todos que estão na casa."],[3,5,16,"Assim resplandeça a vossa luz diante dos homens, para que vejam as vossas boas obras e glorifiquem a vosso Pai, que está nos céus."],[3,5,45,"Porque faz que o seu sol se levante sobre maus e bons, e a chuva desça sobre justos e injustos."],[3,5,46,"Pois, se amardes os que vos amam, que galardão tereis? Não fazem os publicanos também o mesmo?"],[3,5,47,"E, se saudardes unicamente os vossos irmãos, que fazeis de mais? Não fazem os publicanos também assim?"],[3,5,48,"Sede vós pois perfeitos, como é perfeito o vosso Pai que está nos céus."],[3,6,21,"Porque onde estiver o vosso tesouro, aí estará também o vosso coração."],[3,6,22,"A candeia do corpo são os olhos; de sorte que, se os teus olhos forem bons, todo o teu corpo terá luz;"],[3,6,23,"Se, porém, os teus olhos forem maus, o teu corpo será tenebroso. Se, portanto, a luz que em ti há são trevas, quão grandes serão tais trevas!"],[3,6,24,"Ninguém pode servir a dois senhores; porque ou há de odiar um e amar o outro, ou se dedicará a um e desprezará o outro. Não podeis servir a Deus e a Mamom."],[3,6,25,"Por isso vos digo: Não andeis cuidadosos quanto à vossa vida, pelo que haveis de comer ou pelo que haveis de beber; nem quanto ao vosso corpo, pelo que haveis de vestir. Não é a vida mais do que o mantimento, e o corpo mais do que o vestuário?"],[3,6,26,"Olhai para as aves do céu, que nem semeiam, nem segam, nem ajuntam em celeiros; e vosso Pai celestial as alimenta. Não tendes vós muito mais valor do que elas?"],[3,6,27,"E qual de vós poderá, com todos os seus cuidados, acrescentar um côvado à sua estatura?"],[3,6,28,"E, quanto ao vestuário, por que andais solícitos? Olhai para os lírios do campo, como eles crescem; não trabalham nem fiam;"],[3,6,29,"E eu vos digo que nem mesmo Salomão, em toda a sua glória, se vestiu como qualquer deles."],[3,6,30,"Pois, se Deus assim veste a erva do campo, que hoje existe, e amanhã é lançada no forno, não vos vestirá muito mais a vós, homens de pouca fé?"],[3,6,31,"Não andeis, pois, inquietos, dizendo: Que comeremos, ou que beberemos, ou com que nos vestiremos?"],[3,6,32,"Porque todas estas coisas os gentios procuram. Decerto vosso Pai celestial bem sabe que necessitais de todas estas coisas;"],[3,6,33,"Mas, buscai primeiro o reino de Deus, e a sua justiça, e todas estas coisas vos serão acrescentadas."],[3,6,34,"Não vos inquieteis, pois, pelo dia de amanhã, porque o dia de amanhã cuidará de si mesmo. Basta a cada dia o seu mal."],[3,7,7,"Pedi, e dar-se-vos-á; buscai, e encontrareis; batei, e abrir-se-vos-á."],[3,7,8,"Porque, aquele que pede, recebe; e, o que busca, encontra; e, ao que bate, abrir-se-lhe-á."],[3,7,9,"E qual dentre vós é o homem que, pedindo-lhe pão o seu filho, lhe dará uma pedra?"],[3,7,10,"E, pedindo-lhe peixe, lhe dará uma serpente?"],[3,7,11,"Se vós, pois, sendo maus, sabeis dar boas coisas aos vossos filhos, quanto mais vosso Pai, que está nos céus, dará bens aos que lhe pedirem?"],[3,7,12,"Portanto, tudo o que vós quereis que os homens vos façam, fazei-lho também vós, porque esta é a lei e os profetas."],[3,11,28,"Vinde a mim, todos os que estais cansados e oprimidos, e eu vos aliviarei."],[3,11,29,"Tomai sobre vós o meu jugo, e aprendei de mim, que sou manso e humilde de coração; e encontrareis descanso para as vossas almas."],[3,11,30,"Porque o meu jugo é suave e o meu fardo é leve."],[3,18,20,"Porque, onde estiverem dois ou três reunidos em meu nome, aí estou eu no meio deles."],[3,19,26,"E Jesus, olhando para eles, disse-lhes: Aos homens é isso impossível, mas a Deus tudo é possível."],[3,28,18,"E, chegando-se Jesus, falou-lhes, dizendo: É-me dado todo o poder no céu e na terra."],[3,28,19,"Portanto ide, fazei discípulos de todas as nações, batizando-os em nome do Pai, e do Filho, e do Espírito Santo;"],[3,28,20,"Ensinando-os a guardar todas as coisas que eu vos tenho mandado; e eis que eu estou convosco todos os dias, até a consumação dos séculos. Amém."],[4,9,23,"E Jesus disse-lhe: Se tu podes crer, tudo é possível ao que crê."],[4,10,27,"Jesus, porém, olhando para eles, disse: Para os homens é impossível, mas não para Deus, porque para Deus todas as coisas são possíveis."],[4,11,22,"E Jesus, respondendo, disse-lhes: Tende fé em Deus;"],[4,11,23,"Porque em verdade vos digo que qualquer que disser a este monte: Ergue-te e lança-te no mar, e não duvidar em seu coração, mas crer que se fará aquilo que diz, tudo o que disser lhe será feito."],[4,11,24,"Por isso vos digo que todas as coisas que pedirdes, orando, crede receber, e tê-las-eis."],[4,12,30,"Amarás, pois, ao Senhor teu Deus de todo o teu coração, e de toda a tua alma, e de todo o teu entendimento, e de todas as tuas forças; este é o primeiro mandamento."],[4,12,31,"E o segundo, semelhante a este, é: Amarás o teu próximo como a ti mesmo. Não há outro mandamento maior do que estes."],[5,1,37,"Porque para Deus nada é impossível."],[5,1,46,"Disse então Maria: A minha alma engrandece ao Senhor,"],[5,1,47,"E o meu espírito se alegra em Deus meu Salvador;"],[5,1,48,"Porque atentou na baixeza de sua serva; Pois eis que desde agora todas as gerações me chamarão bem-aventurada,"],[5,1,49,"Porque me fez grandes coisas o Poderoso; E santo é seu nome."],[5,1,50,"E a sua misericórdia é de geração em geração Sobre os que o temem."],[5,1,51,"Com o seu braço agiu valorosamente; Dissipou os soberbos no pensamento de seus corações."],[5,1,52,"Depôs dos tronos os poderosos, E elevou os humildes."],[5,1,53,"Encheu de bens os famintos, E despediu vazios os ricos."],[5,1,54,"Auxiliou a Israel seu servo, Recordando-se da sua misericórdia;"],[5,1,55,"Como falou a nossos pais, Para com Abraão e a sua posteridade, para sempre."],[5,6,27,"Mas a vós, que isto ouvis, digo: Amai a vossos inimigos, fazei bem aos que vos odeiam;"],[5,6,29,"Ao que te ferir numa face, oferece-lhe também a outra; e ao que te houver tirado a capa, nem a túnica recuses;"],[5,6,30,"E dá a qualquer que te pedir; e ao que tomar o que é teu, não lho tornes a pedir."],[5,6,31,"E como vós quereis que os homens vos façam, da mesma maneira lhes fazei vós, também."],[5,6,32,"E se amardes aos que vos amam, que recompensa tereis? Também os pecadores amam aos que os amam."],[5,6,33,"E se fizerdes bem aos que vos fazem bem, que recompensa tereis? Também os pecadores fazem o mesmo."],[5,6,34,"E se emprestardes àqueles de quem esperais tornar a receber, que recompensa tereis? Também os pecadores emprestam aos pecadores, para tornarem a receber outro tanto."],[5,6,35,"Amai, pois, a vossos inimigos, e fazei bem, e emprestai, sem nada esperardes, e será grande o vosso galardão, e sereis filhos do Altíssimo; porque ele é benigno até para com os ingratos e maus."],[5,6,36,"Sede, pois, misericordiosos, como também vosso Pai é misericordioso."],[5,6,37,"Não julgueis, e não sereis julgados; não condeneis, e não sereis condenados; soltai, e soltar-vos-ão."],[5,6,38,"Dai, e ser-vos-á dado; boa medida, recalcada, sacudida e transbordando, vos deitarão no vosso regaço; porque com a mesma medida com que medirdes também vos medirão de novo."],[5,11,9,"E eu vos digo a vós: Pedi, e dar-se-vos-á; buscai, e achareis; batei, e abrir-se-vos-á;"],[5,11,10,"Porque qualquer que pede recebe; e quem busca acha; e a quem bate abrir-se-lhe-á."],[5,11,11,"E qual o pai de entre vós que, se o filho lhe pedir pão, lhe dará uma pedra? Ou, também, se lhe pedir peixe, lhe dará por peixe uma serpente?"],[5,11,12,"Ou, também, se lhe pedir um ovo, lhe dará um escorpião?"],[5,11,13,"Pois se vós, sendo maus, sabeis dar boas dádivas aos vossos filhos, quanto mais dará o Pai celestial o Espírito Santo àqueles que lho pedirem?"],[5,12,22,"E disse aos seus discípulos: Portanto vos digo: Não estejais apreensivos pela vossa vida, sobre o que comereis, nem pelo corpo, sobre o que vestireis."],[5,12,23,"Mais é a vida do que o sustento, e o corpo mais do que as vestes."],[5,12,24,"Considerai os corvos, que nem semeiam, nem segam, nem têm despensa nem celeiro, e Deus os alimenta; quanto mais valeis vós do que as aves?"],[5,12,25,"E qual de vós, sendo solícito, pode acrescentar um côvado à sua estatura?"],[5,12,26,"Pois, se nem ainda podeis as coisas mínimas, por que estais ansiosos pelas outras?"],[5,12,27,"Considerai os lírios, como eles crescem; não trabalham, nem fiam; e digo-vos que nem ainda Salomão, em toda a sua glória, se vestiu como um deles."],[5,12,28,"E, se Deus assim veste a erva que hoje está no campo e amanhã é lançada no forno, quanto mais a vós, homens de pouca fé?"],[5,12,29,"Não pergunteis, pois, que haveis de comer, ou que haveis de beber, e não andeis inquietos."],[5,12,30,"Porque as nações do mundo buscam todas essas coisas; mas vosso Pai sabe que precisais delas."],[5,12,31,"Buscai antes o reino de Deus, e todas estas coisas vos serão acrescentadas."],[5,12,32,"Não temais, ó pequeno rebanho, porque a vosso Pai agradou dar-vos o reino."],[5,18,27,"Mas ele respondeu: As coisas que são impossíveis aos homens são possíveis a Deus."],[6,1,1,"No princípio era o Verbo, e o Verbo estava com Deus, e o Verbo era Deus."],[6,1,2,"Ele estava no princípio com Deus."],[6,1,3,"Todas as coisas foram feitas por ele, e sem ele nada do que foi feito se fez."],[6,1,4,"Nele estava a vida, e a vida era a luz dos homens."],[6,1,5,"E a luz resplandece nas trevas, e as trevas não a compreenderam."],[6,1,12,"Mas, a todos quantos o receberam, deu-lhes o poder de serem feitos filhos de Deus, aos que crêem no seu nome;"],[6,3,16,"Porque Deus amou o mundo de tal maneira que deu o seu Filho unigênito, para que todo aquele que nele crê não pereça, mas tenha a vida eterna."],[6,3,17,"Porque Deus enviou o seu Filho ao mundo, não para que condenasse o mundo, mas para que o mundo fosse salvo por ele."],[6,4,13,"Jesus respondeu, e disse-lhe: Qualquer que beber desta água tornará a ter sede;"],[6,4,14,"Mas aquele que beber da água que eu lhe der nunca terá sede, porque a água que eu lhe der se fará nele uma fonte de água que salte para a vida eterna."],[6,6,35,"E Jesus lhes disse: Eu sou o pão da vida; aquele que vem a mim não terá fome, e quem crê em mim nunca terá sede."],[6,8,12,"Falou-lhes, pois, Jesus outra vez, dizendo: Eu sou a luz do mundo; quem me segue não andará em trevas, mas terá a luz da vida."],[6,8,32,"E conhecereis a verdade, e a verdade vos libertará."],[6,10,11,"Eu sou o bom Pastor; o bom Pastor dá a sua vida pelas ovelhas."],[6,10,27,"As minhas ovelhas ouvem a minha voz, e eu conheço-as, e elas me seguem;"],[6,10,28,"E dou-lhes a vida eterna, e nunca hão de perecer, e ninguém as arrebatará da minha mão."],[6,10,29,"Meu Pai, que mas deu, é maior do que todos; e ninguém pode arrebatá-las da mão de meu Pai."],[6,13,34,"Um novo mandamento vos dou: Que vos ameis uns aos outros; como eu vos amei a vós, que também vós uns aos outros vos ameis."],[6,13,35,"Nisto todos conhecerão que sois meus discípulos, se vos amardes uns aos outros."],[6,14,1,"Não se turbe o vosso coração; credes em Deus, crede também em mim."],[6,14,2,"Na casa de meu Pai há muitas moradas; se não fosse assim, eu vo-lo teria dito. Vou preparar-vos lugar."],[6,14,3,"E quando eu for, e vos preparar lugar, virei outra vez, e vos levarei para mim mesmo, para que onde eu estiver estejais vós também."],[6,14,4,"Mesmo vós sabeis para onde vou, e conheceis o caminho."],[6,14,5,"Disse-lhe Tomé: Senhor, nós não sabemos para onde vais; e como podemos saber o caminho?"],[6,14,6,"Disse-lhe Jesus: Eu sou o caminho, e a verdade e a vida; ninguém vem ao Pai, senão por mim."],[6,14,12,"Na verdade, na verdade vos digo que aquele que crê em mim também fará as obras que eu faço, e as fará maiores do que estas, porque eu vou para meu Pai."],[6,14,13,"E tudo quanto pedirdes em meu nome eu o farei, para que o Pai seja glorificado no Filho."],[6,14,14,"Se pedirdes alguma coisa em meu nome, eu o farei."],[6,14,18,"Não vos deixarei órfãos; voltarei para vós."],[6,14,26,"Mas aquele Consolador, o Espírito Santo, que o Pai enviará em meu nome, esse vos ensinará todas as coisas, e vos fará lembrar de tudo quanto vos tenho dito."],[6,14,27,"Deixo-vos a paz, a minha paz vos dou; não vo-la dou como o mundo a dá. Não se turbe o vosso coração, nem se atemorize."],[6,15,4,"Estai em mim, e eu em vós; como a vara de si mesma não pode dar fruto, se não estiver na videira, assim também vós, se não estiverdes em mim."],[6,15,5,"Eu sou a videira, vós as varas; quem está em mim, e eu nele, esse dá muito fruto; porque sem mim nada podeis fazer."],[6,15,6,"Se alguém não estiver em mim, será lançado fora, como a vara, e secará; e os colhem e lançam no fogo, e ardem."],[6,15,7,"Se vós estiverdes em mim, e as minhas palavras estiverem em vós, pedireis tudo o que quiserdes, e vos será feito."],[6,15,8,"Nisto é glorificado meu Pai, que deis muito fruto; e assim sereis meus discípulos."],[6,15,9,"Como o Pai me amou, também eu vos amei a vós; permanecei no meu amor."],[6,15,10,"Se guardardes os meus mandamentos, permanecereis no meu amor; do mesmo modo que eu tenho guardado os mandamentos de meu Pai, e permaneço no seu amor."],[6,15,11,"Tenho-vos dito isto, para que o meu gozo permaneça em vós, e o vosso gozo seja completo."],[6,15,12,"O meu mandamento é este: Que vos ameis uns aos outros, assim como eu vos amei."],[6,15,13,"Ninguém tem maior amor do que este, de dar alguém a sua vida pelos seus amigos."],[6,15,14,"Vós sereis meus amigos, se fizerdes o que eu vos mando."],[6,15,15,"Já vos não chamarei servos, porque o servo não sabe o que faz o seu senhor; mas tenho-vos chamado amigos, porque tudo quanto ouvi de meu Pai vos tenho feito conhecer."],[6,15,16,"Não me escolhestes vós a mim, mas eu vos escolhi a vós, e vos nomeei, para que vades e deis fruto, e o vosso fruto permaneça; a fim de que tudo quanto em meu nome pedirdes ao Pai ele vo-lo conceda."],[6,15,17,"Isto vos mando: Que vos ameis uns aos outros."],[6,16,33,"Tenho-vos dito isto, para que em mim tenhais paz; no mundo tereis aflições, mas tende bom ânimo, eu venci o mundo."],[7,5,1,"Tendo sido, pois, justificados pela fé, temos paz com Deus, por nosso Senhor Jesus Cristo;"],[7,5,2,"Pelo qual também temos entrada pela fé a esta graça, na qual estamos firmes, e nos gloriamos na esperança da glória de Deus."],[7,5,3,"E não somente isto, mas também nos gloriamos nas tribulações; sabendo que a tribulação produz a paciência,"],[7,5,4,"E a paciência a experiência, e a experiência a esperança."],[7,5,5,"E a esperança não traz confusão, porquanto o amor de Deus está derramado em nossos corações pelo Espírito Santo que nos foi dado."],[7,5,8,"Mas Deus prova o seu amor para conosco, em que Cristo morreu por nós, sendo nós ainda pecadores."],[7,8,1,"Portanto, agora nenhuma condenação há para os que estão em Cristo Jesus, que não andam segundo a carne, mas segundo o Espírito."],[7,8,14,"Porque todos os que são guiados pelo Espírito de Deus esses são filhos de Deus."],[7,8,15,"Porque não recebestes o espírito de escravidão, para outra vez estardes em temor, mas recebestes o Espírito de adoção de filhos, pelo qual clamamos: Aba, Pai."],[7,8,16,"O mesmo Espírito testifica com o nosso espírito que somos filhos de Deus."],[7,8,17,"E, se nós somos filhos, somos logo herdeiros também, herdeiros de Deus, e co-herdeiros de Cristo: se é certo que com ele padecemos, para que também com ele sejamos glorificados."],[7,8,18,"Porque para mim tenho por certo que as aflições deste tempo presente não são para comparar com a glória que em nós há de ser revelada."],[7,8,19,"Porque a ardente expectação da criatura espera a manifestação dos filhos de Deus."],[7,8,20,"Porque a criação ficou sujeita à vaidade, não por sua vontade, mas por causa do que a sujeitou,"],[7,8,21,"Na esperança de que também a mesma criatura será libertada da servidão da corrupção, para a liberdade da glória dos filhos de Deus."],[7,8,22,"Porque sabemos que toda a criação geme e está juntamente com dores de parto até agora."],[7,8,23,"E não só ela, mas nós mesmos, que temos as primícias do Espírito, também gememos em nós mesmos, esperando a adoção, a saber, a redenção do nosso corpo."],[7,8,24,"Porque em esperança fomos salvos. Ora a esperança que se vê não é esperança; porque o que alguém vê como o esperará?"],[7,8,25,"Mas, se esperamos o que não vemos, com paciência o esperamos."],[7,8,26,"E da mesma maneira também o Espírito ajuda as nossas fraquezas; porque não sabemos o que havemos de pedir como convém, mas o mesmo Espírito intercede por nós com gemidos inexprimíveis."],[7,8,27,"E aquele que examina os corações sabe qual é a intenção do Espírito; e é ele que segundo Deus intercede pelos santos."],[7,8,28,"E sabemos que todas as coisas contribuem juntamente para o bem daqueles que amam a Deus, daqueles que são chamados segundo o seu propósito."],[7,8,29,"Porque os que dantes conheceu também os predestinou para serem conformes à imagem de seu Filho, a fim de que ele seja o primogênito entre muitos irmãos."],[7,8,30,"E aos que predestinou a estes também chamou; e aos que chamou a estes também justificou; e aos que justificou a estes também glorificou."],[7,8,31,"Que diremos, pois, a estas coisas? Se Deus é por nós, quem será contra nós?"],[7,8,32,"Aquele que nem mesmo a seu próprio Filho poupou, antes o entregou por todos nós, como nos não dará também com ele todas as coisas?"],[7,8,33,"Quem intentará acusação contra os escolhidos de Deus? É Deus quem os justifica."],[7,8,34,"Quem é que condena? Pois é Cristo quem morreu, ou antes quem ressuscitou dentre os mortos, o qual está à direita de Deus, e também intercede por nós."],[7,8,35,"Quem nos separará do amor de Cristo? A tribulação, ou a angústia, ou a perseguição, ou a fome, ou a nudez, ou o perigo, ou a espada?"],[7,8,36,"Como está escrito:Por amor de ti somos entregues à morte todo o dia;Somos reputados como ovelhas para o matadouro."],[7,8,37,"Mas em todas estas coisas somos mais do que vencedores, por aquele que nos amou."],[7,8,38,"Porque estou certo de que, nem a morte, nem a vida, nem os anjos, nem os principados, nem as potestades, nem o presente, nem o porvir,"],[7,8,39,"Nem a altura, nem a profundidade, nem alguma outra criatura nos poderá separar do amor de Deus, que está em Cristo Jesus nosso Senhor."],[7,12,1,"Rogo-vos, pois, irmãos, pela compaixão de Deus, que apresenteis os vossos corpos em sacrifício vivo, santo e agradável a Deus, que é o vosso culto racional."],[7,12,2,"E não sede conformados com este mundo, mas sede transformados pela renovação do vosso entendimento, para que experimenteis qual seja a boa, agradável, e perfeita vontade de Deus."],[7,12,3,"Porque pela graça que me é dada, digo a cada um dentre vós que não pense de si mesmo além do que convém; antes, pense com moderação, conforme a medida da fé que Deus repartiu a cada um."],[7,12,4,"Porque assim como em um corpo temos muitos membros, e nem todos os membros têm a mesma operação,"],[7,12,5,"Assim nós, que somos muitos, somos um só corpo em Cristo, mas individualmente somos membros uns dos outros."],[7,12,6,"De modo que, tendo diferentes dons, segundo a graça que nos é dada, se é profecia, seja ela segundo a medida da fé;"],[7,12,7,"Se é ministério, seja em ministrar; se é ensinar, haja dedicação ao ensino;"],[7,12,8,"Ou o que exorta, use esse dom em exortar; o que reparte, faça-o com liberalidade; o que preside, com cuidado; o que exercita misericórdia, com alegria."],[7,12,9,"O amor seja não fingido. Aborrecei o mal e apegai-vos ao bem."],[7,12,10,"Amai-vos cordialmente uns aos outros com amor fraternal, preferindo-vos em honra uns aos outros."],[7,12,11,"Não sejais vagarosos no cuidado; sede fervorosos no espírito, servindo ao Senhor;"],[7,12,12,"Alegrai-vos na esperança, sede pacientes na tribulação, perseverai na oração;"],[7,12,13,"Comunicai com os santos nas suas necessidades, segui a hospitalidade;"],[7,12,15,"Alegrai-vos com os que se alegram; e chorai com os que choram;"],[7,12,16,"Sede unânimes entre vós; não ambicioneis coisas altas, mas acomodai-vos às humildes; não sejais sábios em vós mesmos;"],[7,12,17,"A ninguém torneis mal por mal; procurai as coisas honestas, perante todos os homens."],[7,12,18,"Se for possível, quanto estiver em vós, tende paz com todos os homens."],[7,12,20,"Portanto, se o teu inimigo tiver fome, dá-lhe de comer; se tiver sede, dá-lhe de beber; porque, fazendo isto, amontoarás brasas de fogo sobre a sua cabeça."],[7,12,21,"Não te deixes vencer do mal, mas vence o mal com o bem."],[7,15,13,"Ora o Deus de esperança vos encha de todo o gozo e paz em crença, para que abundeis em esperança pela virtude do Espírito Santo."],[8,13,1,"Ainda que eu falasse as línguas dos homens e dos anjos, e não tivesse amor, seria como o metal que soa ou como o sino que tine."],[8,13,2,"E ainda que tivesse o dom de profecia, e conhecesse todos os mistérios e toda a ciência, e ainda que tivesse toda a fé, de maneira tal que transportasse os montes, e não tivesse amor, nada seria."],[8,13,3,"E ainda que distribuísse toda a minha fortuna para sustento dos pobres, e ainda que entregasse o meu corpo para ser queimado, e não tivesse amor, nada disso me aproveitaria."],[8,13,4,"O amor é sofredor, é benigno; o amor não é invejoso; o amor não trata com leviandade, não se ensoberbece."],[8,13,5,"Não se porta com indecência, não busca os seus interesses, não se irrita, não suspeita mal;"],[8,13,6,"Não folga com a injustiça, mas folga com a verdade;"],[8,13,7,"Tudo sofre, tudo crê, tudo espera, tudo suporta."],[8,13,8,"O amor nunca falha; mas havendo profecias, serão aniquiladas; havendo línguas, cessarão; havendo ciência, desaparecerá;"],[8,13,9,"Porque, em parte, conhecemos, e em parte profetizamos;"],[8,13,10,"Mas, quando vier o que é perfeito, então o que o é em parte será aniquilado."],[8,13,11,"Quando eu era menino, falava como menino, sentia como menino, discorria como menino, mas, logo que cheguei a ser homem, acabei com as coisas de menino."],[8,13,12,"Porque agora vemos por espelho em enigma, mas então veremos face a face; agora conheço em parte, mas então conhecerei como também sou conhecido."],[8,13,13,"Agora, pois, permanecem a fé, a esperança e o amor, estes três, mas o maior destes é o amor."],[8,15,57,"Mas graças a Deus que nos dá a vitória por nosso Senhor Jesus Cristo."],[8,15,58,"Portanto, meus amados irmãos, sede firmes e constantes, sempre abundantes na obra do Senhor, sabendo que o vosso trabalho não é vão no Senhor."],[8,16,13,"Vigiai, estai firmes na fé; portai-vos varonilmente, e fortalecei-vos."],[8,16,14,"Todas as vossas coisas sejam feitas com amor."],[9,4,6,"Porque Deus, que disse que das trevas resplandecesse a luz, é quem resplandeceu em nossos corações, para iluminação do conhecimento da glória de Deus, na face de Jesus Cristo."],[9,4,7,"Temos, porém, este tesouro em vasos de barro, para que a excelência do poder seja de Deus, e não de nós."],[9,4,8,"Em tudo somos atribulados, mas não angustiados; perplexos, mas não desanimados."],[9,4,9,"Perseguidos, mas não desamparados; abatidos, mas não destruídos;"],[9,4,10,"Trazendo sempre por toda a parte a mortificação do Senhor Jesus no nosso corpo, para que a vida de Jesus se manifeste também nos nossos corpos;"],[9,4,11,"E assim nós, que vivemos, estamos sempre entregues à morte por amor de Jesus, para que a vida de Jesus se manifeste também na nossa carne mortal."],[9,4,12,"De maneira que em nós opera a morte, mas em vós a vida."],[9,4,13,"E temos portanto o mesmo espírito de fé, como está escrito: Cri, por isso falei; nós cremos também, por isso também falamos."],[9,4,14,"Sabendo que o que ressuscitou o Senhor Jesus nos ressuscitará também por Jesus, e nos apresentará convosco."],[9,4,15,"Porque tudo isto é por amor de vós, para que a graça, multiplicada por meio de muitos, faça abundar a ação de graças para glória de Deus."],[9,4,16,"Por isso não desfalecemos; mas, ainda que o nosso homem exterior se corrompa, o interior, contudo, se renova de dia em dia."],[9,4,17,"Porque a nossa leve e momentânea tribulação produz para nós um peso eterno de glória mui excelente;"],[9,4,18,"Não atentando nós nas coisas que se vêem, mas nas que se não vêem; porque as que se vêem são temporais, e as que se não vêem são eternas."],[9,5,7,"(Porque andamos por fé, e não por vista)."],[9,5,17,"Assim que, se alguém está em Cristo, nova criatura é; as coisas velhas já passaram; eis que tudo se fez novo."],[9,9,6,"E digo isto: Que o que semeia pouco, pouco também ceifará; e o que semeia em abundância, em abundância ceifará."],[9,9,7,"Cada um contribua segundo propôs no seu coração; não com tristeza, ou por necessidade; porque Deus ama ao que dá com alegria."],[9,9,8,"E Deus é poderoso para fazer abundar em vós toda a graça, a fim de que tendo sempre, em tudo, toda a suficiência, abundeis em toda a boa obra;"],[9,12,9,"E disse-me: A minha graça te basta, porque o meu poder se aperfeiçoa na fraqueza. De boa vontade, pois, me gloriarei nas minhas fraquezas, para que em mim habite o poder de Cristo."],[9,12,10,"Por isso sinto prazer nas fraquezas, nas injúrias, nas necessidades, nas perseguições, nas angústias por amor de Cristo. Porque quando estou fraco então sou forte."],[10,2,20,"Já estou crucificado com Cristo; e vivo, não mais eu, mas Cristo vive em mim; e a vida que agora vivo na carne, vivo-a pela fé do Filho de Deus, o qual me amou, e se entregou a si mesmo por mim."],[10,5,22,"Mas o fruto do Espírito é: amor, gozo, paz, longanimidade, benignidade, bondade, fé, mansidão, temperança."],[10,5,23,"Contra estas coisas não há lei."],[10,5,24,"E os que são de Cristo crucificaram a carne com as suas paixões e concupiscências."],[10,5,25,"Se vivemos em Espírito, andemos também em Espírito."],[10,5,26,"Não sejamos cobiçosos de vanglórias, irritando-nos uns aos outros, invejando-nos uns aos outros."],[10,6,9,"E não nos cansemos de fazer bem, porque a seu tempo ceifaremos, se não houvermos desfalecido."],[10,6,10,"Então, enquanto temos tempo, façamos bem a todos, mas principalmente aos domésticos da fé."],[11,1,3,"Bendito o Deus e Pai de nosso Senhor Jesus Cristo, o qual nos abençoou com todas as bênçãos espirituais nos lugares celestiais em Cristo;"],[11,1,4,"Como também nos elegeu nele antes da fundação do mundo, para que fôssemos santos e irrepreensíveis diante dele em amor;"],[11,1,5,"E nos predestinou para filhos de adoção por Jesus Cristo, para si mesmo, segundo o beneplácito de sua vontade,"],[11,1,6,"Para louvor da glória de sua graça, pela qual nos fez agradáveis a si no Amado,"],[11,1,8,"Que ele fez abundar para conosco em toda a sabedoria e prudência;"],[11,2,8,"Porque pela graça sois salvos, por meio da fé; e isto não vem de vós, é dom de Deus."],[11,2,9,"Não vem das obras, para que ninguém se glorie;"],[11,2,10,"Porque somos feitura sua, criados em Cristo Jesus para as boas obras, as quais Deus preparou para que andássemos nelas."],[11,3,16,"Para que, segundo as riquezas da sua glória, vos conceda que sejais corroborados com poder pelo seu Espírito no homem interior;"],[11,3,17,"Para que Cristo habite pela fé nos vossos corações; a fim de, estando arraigados e fundados em amor,"],[11,3,18,"Poderdes perfeitamente compreender, com todos os santos, qual seja a largura, e o comprimento, e a altura, e a profundidade,"],[11,3,19,"E conhecer o amor de Cristo, que excede todo o entendimento, para que sejais cheios de toda a plenitude de Deus."],[11,3,20,"Ora, àquele que é poderoso para fazer tudo muito mais abundantemente além daquilo que pedimos ou pensamos, segundo o poder que em nós opera,"],[11,3,21,"A esse glória na igreja, por Jesus Cristo, em todas as gerações, para todo o sempre. Amém."],[11,4,2,"Com toda a humildade e mansidão, com longanimidade, suportando-vos uns aos outros em amor,"],[11,4,3,"Procurando guardar a unidade do Espírito pelo vínculo da paz."],[11,4,4,"Há um só corpo e um só Espírito, como também fostes chamados em uma só esperança da vossa vocação;"],[11,4,5,"Um só Senhor, uma só fé, um só batismo;"],[11,4,6,"Um só Deus e Pai de todos, o qual é sobre todos, e por todos e em todos vós."],[11,4,29,"Não saia da vossa boca nenhuma palavra torpe, mas só a que for boa para promover a edificação, para que dê graça aos que a ouvem."],[11,4,30,"E não entristeçais o Espírito Santo de Deus, no qual estais selados para o dia da redenção."],[11,4,32,"Antes sede uns para com os outros benignos, misericordiosos, perdoando-vos uns aos outros, como também Deus vos perdoou em Cristo."],[11,5,1,"Sede, pois, imitadores de Deus s coisas em Cristo que me fortalece."],[12,4,19,"O meu Deus, segundo as suas riquezas, suprirá todas as vossas necessidades em glória, por Cristo Jesus."],[13,3,1,"Portanto, se já ressuscitastes com Cristo, buscai as coisas que são de cima, onde Cristo está assentado à destra de Deus."],[13,3,2,"Pensai nas coisas que são de cima, e não nas que são da terra;"],[13,3,3,"Porque já estais mortos, e a vossa vida está escondida com Cristo em Deus."],[13,3,4,"Quando Cristo, que é a nossa vida, se manifestar, então também vós vos manifestareis com ele em glória."],[13,3,7,"Nas quais, também, em outro tempo andastes, quando vivíeis nelas."],[13,3,9,"Não mintais uns aos outros, pois que já vos despistes do velho homem com os seus feitos,"],[13,3,10,"E vos vestistes do novo, que se renova para o conhecimento, segundo a imagem daquele que o criou;"],[13,3,11,"Onde não há grego, nem judeu, circuncisão, nem incircuncisão, bárbaro, cita, servo ou livre; mas Cristo é tudo, e em todos."],[13,3,12,"Revesti-vos, pois, como eleitos de Deus, santos e amados, de entranhas de misericórdia, de benignidade, humildade, mansidão, longanimidade;"],[13,3,13,"Suportando-vos uns aos outros, e perdoando-vos uns aos outros, se alguém tiver queixa contra outro; assim como Cristo vos perdoou, assim fazei vós também."],[13,3,14,"E, sobre tudo isto, revesti-vos de amor, que é o vínculo da perfeição."],[13,3,15,"E a paz de Deus, para a qual também fostes chamados em um corpo, domine em vossos corações; e sede agradecidos."],[13,3,16,"A palavra de Cristo habite em vós abundantemente, em toda a sabedoria, ensinando-vos e admoestando-vos uns aos outros, com salmos, hinos e cânticos espirituais, cantando ao Senhor com graça em vosso coração."],[13,3,17,"E, quanto fizerdes por palavras ou por obras, fazei tudo em nome do Senhor Jesus, dando por ele graças a Deus Pai."],[14,5,11,"Por isso exortai-vos uns aos outros, e edificai-vos uns aos outros, como também o fazeis."],[14,5,12,"E rogamo-vos, irmãos, que reconheçais os que trabalham entre vós e que presidem sobre vós no Senhor, e vos admoestam;"],[14,5,13,"E que os tenhais em grande estima e amor, por causa da sua obra. Tende paz entre vós."],[14,5,14,"Rogamo-vos, também, irmãos, que admoesteis os desordeiros, consoleis os de pouco ânimo, sustenteis os fracos, e sejais pacientes para com todos."],[14,5,15,"Vede que ninguém dê a outrem mal por mal, mas segui sempre o bem, tanto uns para com os outros, como para com todos."],[14,5,18,"Em tudo dai graças, porque esta é a vontade de Deus em Cristo Jesus para convosco."],[14,5,22,"Abstende-vos de toda a aparência do mal."],[14,5,23,"E o mesmo Deus de paz vos santifique em tudo; e todo o vosso espírito, e alma, e corpo, sejam plenamente conservados irrepreensíveis para a vinda de nosso Senhor Jesus Cristo."],[14,5,24,"Fiel é o que vos chama, o qual também o fará."],[15,1,7,"Porque Deus não nos deu o espírito de temor, mas de fortaleza, e de amor, e de moderação."],[16,4,16,"Cheguemos, pois, com confiança ao trono da graça, para que possamos alcançar misericórdia e achar graça, a fim de sermos ajudados em tempo oportuno."],[16,10,23,"Retenhamos firmes a confissão da nossa esperança; porque fiel é o que prometeu."],[16,10,24,"E consideremo-nos uns aos outros, para nos estimularmos ao amor e às boas obras,"],[16,10,25,"Não deixando a nossa congregação, como é costume de alguns, antes admoestando-nos uns aos outros; e tanto mais, quanto vedes que se vai aproximando aquele dia."],[16,11,1,"Ora, a fé é o firme fundamento das coisas que se esperam, e a prova das coisas que se não vêem."],[16,11,6,"Ora, sem fé é impossível agradar-lhe; porque é necessário que aquele que se aproxima de Deus creia que ele existe, e que é galardoador dos que o buscam."],[16,12,1,"Portanto nós também, pois que estamos rodeados de uma tão grande nuvem de testemunhas, deixemos todo o embaraço, e o pecado que tão de perto nos rodeia, e corramos com paciência a carreira que nos está proposta,"],[16,12,2,"Olhando para Jesus, autor e consumador da fé, o qual, pelo gozo que lhe estava proposto, suportou a cruz, desprezando a afronta, e assentou-se à destra do trono de Deus."],[16,13,5,"Sejam vossos costumes sem avareza, contentando-vos com o que tendes; porque ele disse: Não te deixarei, nem te desampararei."],[16,13,6,"E assim com confiança ousemos dizer: O Senhor é o meu ajudador, e não temerei O que me possa fazer o homem."],[16,13,7,"Lembrai-vos dos vossos pastores, que vos falaram a palavra de Deus, a fé dos quais imitai, atentando para a sua maneira de viver."],[16,13,8,"Jesus Cristo é o mesmo, ontem, e hoje, e eternamente."],[17,1,2,"Meus irmãos, tende grande gozo quando cairdes em várias tentações;"],[17,1,3,"Sabendo que a prova da vossa fé opera a paciência."],[17,1,4,"Tenha, porém, a paciência a sua obra perfeita, para que sejais perfeitos e completos, sem faltar em coisa alguma."],[17,1,5,"E, se algum de vós tem falta de sabedoria, peça-a a Deus, que a todos dá liberalmente, e o não lança em rosto, e ser-lhe-á dada."],[17,1,6,"Peça-a, porém, com fé, em nada duvidando; porque o que duvida é semelhante à onda do mar, que é levada pelo vento, e lançada de uma para outra parte."],[17,1,12,"Bem-aventurado o homem que sofre a tentação; porque, quando for provado, receberá a coroa da vida, a qual o Senhor tem prometido aos que o amam."],[17,1,17,"Toda a boa dádiva e todo o dom perfeito vem do alto, descendo do Pai das luzes, em quem não há mudança nem sombra de variação."],[17,4,7,"Sujeitai-vos, pois, a Deus, resisti ao diabo, e ele fugirá de vós."],[17,4,8,"Chegai-vos a Deus, e ele se chegará a vós. Alimpai as mãos, pecadores; e, vós de duplo ânimo, purificai os corações."],[18,2,9,"Mas vòs sois a geração eleita, o sacerdòcio real, a nação santa, o povo adquirido, para que anuncieis as virtudes daquele que vos chamou das trevas para a sua maravilhosa luz;"],[18,3,8,"E, finalmente, sede todos de um mesmo sentimento, compassivos, amando os irmãos, entranhavelmente misericordiosos e afáveis."],[18,3,9,"Não tornando mal por mal, ou injúria por injúria; antes, pelo contrário, bendizendo; sabendo que para isto fostes chamados, para que por herança alcanceis a bênção."],[18,5,6,"Humilhai-vos, pois, debaixo da potente mão de Deus, para que a seu tempo vos exalte;"],[18,5,7,"Lançando sobre ele toda a vossa ansiedade, porque ele tem cuidado de vós."],[18,5,8,"Sede sóbrios; vigiai; porque o diabo, vosso adversário, anda em derredor, bramando como leão, buscando a quem possa tragar;"],[18,5,9,"Ao qual resisti firmes na fé, sabendo que as mesmas aflições se cumprem entre os vossos irmãos no mundo."],[18,5,10,"E o Deus de toda a graça, que em Cristo Jesus nos chamou à sua eterna glória, depois de havemos padecido um pouco, ele mesmo vos aperfeiçoe, confirme, fortifique e estabeleça."],[19,3,1,"Vede quão grande amor nos tem concedido o Pai, que fôssemos chamados filhos de Deus. Por isso o mundo não nos conhece; porque não o conhece a ele."],[19,3,18,"Meus filhinhos, não amemos de palavra, nem de língua, mas por obra e em verdade."],[19,4,7,"Amados, amemo-nos uns aos outros; porque o amor é de Deus; e qualquer que ama é nascido de Deus e conhece a Deus."],[19,4,8,"Aquele que não ama não conhece a Deus; porque Deus é amor."],[19,4,9,"Nisto se manifestou o amor de Deus para conosco: que Deus enviou seu Filho unigênito ao mundo, para que por ele vivamos."],[19,4,10,"Nisto está o amor, não em que nós tenhamos amado a Deus, mas em que ele nos amou a nós, e enviou seu Filho para propiciação pelos nossos pecados."],[19,4,11,"Amados, se Deus assim nos amou, também nòs devemos amar uns aos outros."],[19,4,12,"Ninguém jamais viu a Deus; se nos amamos uns aos outros, Deus está em nós, e em nós é perfeito o seu amor."],[19,4,13,"Nisto conhecemos que estamos nele, e ele em nós, pois que nos deu do seu Espírito."],[19,4,14,"E vimos, e testificamos que o Pai enviou seu Filho para Salvador do mundo."],[19,4,15,"Qualquer que confessar que Jesus é o Filho de Deus, Deus está nele, e ele em Deus."],[19,4,16,"E nós conhecemos, e cremos no amor que Deus nos tem. Deus é amor; e quem está em amor está em Deus, e Deus nele."],[19,4,17,"Nisto é perfeito o amor para conosco, para que no dia do juízo tenhamos confiança; porque, qual ele é, somos nós também neste mundo."],[19,4,18,"No amor não há temor, antes o perfeito amor lança fora o temor; porque o temor tem consigo a pena, e o que teme não é perfeito em amor."],[19,4,19,"Nós o amamos a ele porque ele nos amou primeiro."],[19,5,14,"E esta é a confiança que temos nele, que, se pedirmos alguma coisa, segundo a sua vontade, ele nos ouve."],[19,5,15,"E, se sabemos que nos ouve em tudo o que pedimos, sabemos que alcançamos as petições que lhe fizemos."]];

  // Embaralha a lista de forma fixa (mesma ordem para todo mundo): um versículo por dia,
  // sem repetir até percorrer todos.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const ORDEM = (function () {
    const arr = Array.from({ length: BIBLIA.length }, (_, i) => i);
    const rnd = mulberry32(20261113);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  })();

  // ---------- Armazenamento (plano B se o navegador bloquear) ----------
  const K_SAVED = 'vd_saved_v1';
  const mem = {};
  let storageOk = true;
  function load(k, def) {
    try { const v = localStorage.getItem(k); if (v) return JSON.parse(v); } catch (e) { storageOk = false; }
    return mem[k] !== undefined ? mem[k] : def;
  }
  function store(k, v) {
    mem[k] = v;
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { storageOk = false; }
  }
  try { localStorage.setItem('vd_test', '1'); localStorage.removeItem('vd_test'); } catch (e) { storageOk = false; }

  let saved = load(K_SAVED, []);
  if (!Array.isArray(saved)) saved = [];
  const $ = id => document.getElementById(id);

  // ---------- Tela principal ----------
  let todayVerse = null;
  function isSaved(v) { return saved.some(x => x.ref === v.ref && x.text === v.text); }

  function render() {
    const now = new Date();
    const h = now.getHours();
    $('hello').textContent = 'Olá, ' + NOME;
    $('saudacao').textContent = (h < 12 ? 'Bom dia' : (h < 18 ? 'Boa tarde' : 'Boa noite')) + '.';
    $('hora').textContent = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', hour12: false });
    $('data').textContent = now.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });

    // dias inteiros desde 1970 (fuso do aparelho): muda todo dia à meia-noite
    const dayNumber = Math.floor((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - new Date(1970, 0, 1)) / 86400000);
    const e = BIBLIA[ORDEM[dayNumber % BIBLIA.length]];
    todayVerse = { ref: LIVROS[e[0]] + ' ' + e[1] + ':' + e[2], text: e[3] };
    $('text').textContent = '“' + todayVerse.text + '”';
    $('ref').textContent = todayVerse.ref;

    const f = FRASES[dayNumber % FRASES.length];
    $('frase').textContent = '“' + f.text + '”' + (f.author ? ' — ' + f.author : '');
    updateSaveButton();
  }

  function updateSaveButton() {
    const on = todayVerse && isSaved(todayVerse);
    const b = $('btn-save');
    b.textContent = on ? '♥ Salvo' : '♡ Salvar versículo';
    b.classList.toggle('on', !!on);
    $('saved-count').textContent = saved.length;
  }

  $('btn-save').addEventListener('click', () => {
    if (!todayVerse) return;
    if (isSaved(todayVerse)) {
      saved = saved.filter(x => !(x.ref === todayVerse.ref && x.text === todayVerse.text));
    } else {
      saved.push({ ref: todayVerse.ref, text: todayVerse.text, savedAt: Date.now() });
    }
    store(K_SAVED, saved);
    updateSaveButton();
  });

  // ---------- Salvos ----------
  function showView(name) {
    $('view-main').hidden = name !== 'main';
    $('view-saved').hidden = name !== 'saved';
  }
  function renderSaved() {
    const box = $('saved-list');
    box.textContent = '';
    const list = saved.slice().sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0));
    $('saved-empty').hidden = list.length > 0;
    list.forEach(v => {
      const item = document.createElement('div'); item.className = 'item';
      const t = document.createElement('span'); t.textContent = '“' + v.text + '”';
      const r = document.createElement('span'); r.className = 'ref'; r.textContent = v.ref;
      const row = document.createElement('div'); row.className = 'row';
      const d = document.createElement('span');
      d.textContent = v.savedAt ? 'Salvo em ' + new Date(v.savedAt).toLocaleDateString('pt-BR') : '';
      const rm = document.createElement('button'); rm.className = 'rm'; rm.textContent = 'remover';
      rm.addEventListener('click', () => {
        saved = saved.filter(x => !(x.ref === v.ref && x.text === v.text));
        store(K_SAVED, saved); renderSaved(); updateSaveButton();
      });
      row.append(d, rm);
      item.append(t, r, row);
      box.append(item);
    });
    $('warn-saved').hidden = storageOk;
  }
  $('btn-saved').addEventListener('click', () => { renderSaved(); showView('saved'); });
  $('btn-back').addEventListener('click', () => showView('main'));

  render();
  setInterval(render, 30000);
</script>
